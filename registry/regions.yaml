# Regulatory regions, the profiles they share and the preset lists those permit.
# Region and preset names are RegionCode and ModemPreset values without their
# REGION_ / MODEM_ prefix. Frequencies are exact hertz. A band edge that has no
# exact value rounds inward: the lower edge up, the upper edge down. Every region
# states edge_clearance with its reason. Any change to this file raises revision;
# tools/gen_registry.py --check enforces it.
revision: 3

preset_lists:
  - name: "STD"
    presets: [LONG_FAST, MEDIUM_SLOW, MEDIUM_FAST, SHORT_SLOW, SHORT_FAST, LONG_MODERATE, SHORT_TURBO, LONG_TURBO, MEDIUM_TURBO]
  - name: "EU_868"
    presets: [LONG_FAST, MEDIUM_SLOW, MEDIUM_FAST, SHORT_SLOW, SHORT_FAST, LONG_MODERATE]
  # STD without the 125 kHz presets: LONG_MODERATE takes about 7.7 s for a full packet,
  # over ARIB STD-T108's 4 s transmission limit.
  - name: "JP"
    presets: [LONG_FAST, MEDIUM_SLOW, MEDIUM_FAST, SHORT_SLOW, SHORT_FAST, NARROW_SLOW, NARROW_FAST, SHORT_TURBO, LONG_TURBO, MEDIUM_TURBO]
  - name: "LITE"
    presets: [LITE_FAST, LITE_SLOW]
  - name: "NARROW"
    presets: [NARROW_FAST, NARROW_SLOW]
  - name: "TINY"
    presets: [TINY_FAST, TINY_SLOW]

profiles:
  - name: "STD"
    preset_list: "STD"
    default_preset: LONG_FAST
    spacing_hz: 0
    padding_hz: 0
    unit_channel_hz: 0
    max_bandwidth_hz: 0
    audio_permitted: true
    licensed_only: false
    position_throttle: 1
    telemetry_throttle: 1
    default_hop_start: 3
  - name: "EU868"
    preset_list: "EU_868"
    default_preset: LONG_FAST
    spacing_hz: 0
    padding_hz: 0
    unit_channel_hz: 0
    max_bandwidth_hz: 0
    audio_permitted: false
    licensed_only: false
    position_throttle: 1
    telemetry_throttle: 1
    default_hop_start: 3
  # ARIB STD-T108 200 kHz unit channels: a signal bonds ceil(bw / 200 kHz) of them and
  # is centred on the bond.
  - name: "JP"
    preset_list: "JP"
    default_preset: LONG_FAST
    spacing_hz: 0
    unit_channel_hz: 200000
    max_bandwidth_hz: 0
    audio_permitted: true
    licensed_only: false
    position_throttle: 1
    telemetry_throttle: 1
    default_hop_start: 3
  # EU_866: each 200 kHz block is one unit channel holding one slot at its centre.
  - name: "LITE"
    preset_list: "LITE"
    default_preset: LITE_FAST
    spacing_hz: 0
    unit_channel_hz: 200000
    max_bandwidth_hz: 0
    audio_permitted: false
    licensed_only: false
    position_throttle: 10
    telemetry_throttle: 10
    default_hop_start: 3
  # EU_874, EU_917: continuous within each block, bandwidth at most 200 kHz.
  - name: "LITE_FLEX"
    preset_list: "LITE"
    default_preset: LITE_FAST
    spacing_hz: 0
    padding_hz: 0
    unit_channel_hz: 0
    max_bandwidth_hz: 200000
    audio_permitted: false
    licensed_only: false
    position_throttle: 10
    telemetry_throttle: 10
    default_hop_start: 3
  - name: "NARROW"
    preset_list: "NARROW"
    default_preset: NARROW_SLOW
    spacing_hz: 0
    padding_hz: 10400
    unit_channel_hz: 0
    max_bandwidth_hz: 0
    audio_permitted: true
    licensed_only: false
    position_throttle: 1
    telemetry_throttle: 1
    default_hop_start: 3
  # 15.6 kHz on a 20 kHz channel grid.
  - name: "HAM_20KHZ"
    preset_list: "TINY"
    default_preset: TINY_FAST
    spacing_hz: 0
    unit_channel_hz: 20000
    max_bandwidth_hz: 0
    audio_permitted: false
    licensed_only: true
    position_throttle: 2
    telemetry_throttle: 2
    default_hop_start: 3
  # 62.5 kHz on a 100 kHz channel grid.
  - name: "HAM_100KHZ"
    preset_list: "NARROW"
    default_preset: NARROW_SLOW
    spacing_hz: 0
    unit_channel_hz: 100000
    max_bandwidth_hz: 0
    audio_permitted: false
    licensed_only: true
    position_throttle: 1
    telemetry_throttle: 1
    default_hop_start: 3

swap_groups:
  - regions: [EU_868, EU_866, EU_N_868]

# edge_clearance: true drops one slot when the outer slots' RF edges would sit closer
# than a quarter bandwidth to the band edge, unless that leaves fewer than four gaps.
# Raster profiles always say false.
