  # receives. Any field but the code differing from US is rejected.
  - region: "UNSET"
    profile: "STD"
    freq_start_hz: 902000000
    freq_end_hz: 928000000
    duty_cycle_permille: 1000
    power_limit_dbm: 30
    frequency_switching: false
    wide_lora: false
    override_slot: 0
    edge_clearance: true # mirrors US
  # https://www.thethingsnetwork.org/docs/lorawan/regional-parameters/
