# Regulatory regions, the profiles they share and the preset lists those permit.
# Region and preset names are RegionCode and ModemPreset values without their
# REGION_ / MODEM_ prefix. Fractional values are rounded down to the field unit,
# and firmware keeps the exact value. Any change to this file raises revision;
# tools/gen_registry.py --check enforces it.
revision: 1

preset_lists:
  - name: "STD"
    presets: [LONG_FAST, MEDIUM_SLOW, MEDIUM_FAST, SHORT_SLOW, SHORT_FAST, LONG_MODERATE, SHORT_TURBO, LONG_TURBO, MEDIUM_TURBO]
  - name: "EU_868"
    presets: [LONG_FAST, MEDIUM_SLOW, MEDIUM_FAST, SHORT_SLOW, SHORT_FAST, LONG_MODERATE]
  - name: "LITE"
    presets: [LITE_FAST, LITE_SLOW]
  - name: "NARROW"
    presets: [NARROW_FAST, NARROW_SLOW]
  - name: "TINY"
    presets: [TINY_FAST, TINY_SLOW]

profiles:
  - name: "STD"
    preset_list: "STD"
    default_preset: LONG_FAST
    spacing_khz: 0
    padding_khz: 0
    audio_permitted: true
    licensed_only: false
    position_throttle: 1
    telemetry_throttle: 1
  - name: "EU868"
    preset_list: "EU_868"
    default_preset: LONG_FAST
    spacing_khz: 0
    padding_khz: 0
    audio_permitted: false
    licensed_only: false
    position_throttle: 1
    telemetry_throttle: 1
  - name: "LITE"
    preset_list: "LITE"
    default_preset: LITE_FAST
    spacing_khz: 400
    padding_khz: 37
    audio_permitted: false
    licensed_only: false
    position_throttle: 10
    telemetry_throttle: 10
  - name: "NARROW"
    preset_list: "NARROW"
    default_preset: NARROW_SLOW
    spacing_khz: 0
    padding_khz: 10
    audio_permitted: true
    licensed_only: false
    position_throttle: 1
    telemetry_throttle: 1
  - name: "HAM_20KHZ"
    preset_list: "TINY"
    default_preset: TINY_FAST
    spacing_khz: 0
    padding_khz: 2
    audio_permitted: false
    licensed_only: true
    position_throttle: 2
    telemetry_throttle: 2
  - name: "HAM_100KHZ"
    preset_list: "NARROW"
    default_preset: NARROW_SLOW
    spacing_khz: 0
    padding_khz: 18
    audio_permitted: false
    licensed_only: true
    position_throttle: 1
    telemetry_throttle: 1

swap_groups:
  - regions: [EU_868, EU_866, EU_N_868]

regions:
  - region: "US"
    profile: "STD"
    freq_start_mhz_x100: 90200
    freq_end_mhz_x100: 92800
    duty_cycle: 100
    router_duty_cycle: 0
    power_limit_dbm: 30
    frequency_switching: false
    wide_lora: false
    override_slot: 0
