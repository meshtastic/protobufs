# Device roles and the configurations worth naming (role_registry.proto). Roles are the
# Role enum values. A row is a role, its switches (DeviceConfig.Flags role switches, each
# valid on one role; tak_flags are TAKConfig.Flags) and the defaults a device installs when
# it takes that configuration; defaults left out leave the device's value alone. No two rows
# share a role, switches and TAK flags, and every role has a row without switches. Any
# change to this file raises revision; tools/gen_registry.py --check enforces it.
revision: 2
roles:
  - role: "CLIENT"
    label: "Client"
    description: "App connected or stand alone messaging device."
  - role: "ROUTER"
    label: "Router"
    description: "Infrastructure node on a tower or mountain top. Needs exceptional coverage."
  - role: "TRACKER"
    label: "Tracker"
    description: "Broadcasts GPS position packets as priority."
  - role: "SENSOR"
    label: "Sensor"
    description: "Broadcasts telemetry packets as priority."
presets:
  - name: "CLIENT"
    label: "Client"
    description: "App connected or stand alone messaging device."
    role: "CLIENT"
  - name: "CLIENT_QUIET"
    label: "Client (quiet)"
    description: "Only speaks when spoken to: no routine broadcasts, relays known meshes only."
    role: "CLIENT"
    device_flags: ["DEVICE_QUIET"]
    defaults:
      rebroadcast_mode: "LOCAL_ONLY"
      node_info_broadcast_secs: 2147483647
      position_broadcast_secs: 2147483647
      position_broadcast_smart_enabled: false
      device_update_interval_secs: 2147483647
      sensor_update_interval_secs: 2147483647
  - name: "CLIENT_RELAY_FAVORITES"
    label: "Client (relays favorites)"
    description: "Roof or attic node: relays traffic from and to its favorite nodes like a router."
    role: "CLIENT"
    device_flags: ["DEVICE_RELAY_FAVORITES"]
  - name: "CLIENT_TAK"
    label: "Client with TAK"
    description: "Connected to an ATAK device: CoT traffic, few routine broadcasts."
    role: "CLIENT"
    tak_flags: ["TAK_ENABLED"]
    defaults:
      node_info_broadcast_secs: 86400
      position_broadcast_secs: 86400
      position_broadcast_smart_enabled: false
      position_flags: ["ALTITUDE", "SPEED", "HEADING", "DOP"]
      device_update_interval_secs: 86400
  - name: "ROUTER"
    label: "Router"
    description: "Infrastructure node on a tower or mountain top. Needs exceptional coverage."
    role: "ROUTER"
    defaults:
      reset_intervals: true
      rebroadcast_mode: "CORE_PORTNUMS_ONLY"
      device_update_interval_secs: 43200
      unmessagable: true
  - name: "ROUTER_RELAY_LATE"
    label: "Router (relays late)"
    description: "Infrastructure node that relays only after all others, to fill coverage gaps."
    role: "ROUTER"
    device_flags: ["DEVICE_RELAY_LATE"]
    defaults:
      device_update_interval_secs: 86400
      unmessagable: true
  - name: "TRACKER"
    label: "Tracker"
    description: "Broadcasts GPS position packets as priority."
    role: "TRACKER"
    defaults:
      device_update_interval_secs: 3600
      unmessagable: true
  - name: "TRACKER_TAK"
    label: "Tracker with TAK"
    description: "Tracker that sends its position as TAK PLI."
    role: "TRACKER"
    tak_flags: ["TAK_ENABLED"]
    defaults:
      node_info_broadcast_secs: 86400
      position_broadcast_secs: 180
      position_broadcast_smart_enabled: true
      broadcast_smart_minimum_distance: 20
      broadcast_smart_minimum_interval_secs: 15
      position_flags: ["ALTITUDE", "SPEED", "HEADING", "DOP"]
      device_update_interval_secs: 86400
      unmessagable: true
  - name: "TRACKER_LOST_AND_FOUND"
    label: "Tracker (lost and found)"
    description: "Broadcasts its position as a message every five minutes, to help recover the device."
    role: "TRACKER"
    device_flags: ["DEVICE_LOST_AND_FOUND"]
    defaults:
      position_broadcast_secs: 300
      position_broadcast_smart_enabled: false
  - name: "SENSOR"
    label: "Sensor"
    description: "Broadcasts telemetry packets as priority."
    role: "SENSOR"
    defaults:
      device_update_interval_secs: 3600
      sensor_update_interval_secs: 300
      environment_measurement: true
      unmessagable: true
