# LoRa modem presets. Preset names are ModemPreset values without their MODEM_
# prefix; name is what firmware displays; coding_rate is the denominator of 4/x.
# Fractional bandwidths are rounded down to whole kHz, and firmware keeps the exact
# value. wide_bandwidth_khz 0 means the preset has no 2.4 GHz form. Any change to
# this file raises revision; tools/gen_registry.py --check enforces it.
revision: 1
presets:
  - preset: "LONG_FAST"
    name: "LongFast"
    bandwidth_khz: 250
    wide_bandwidth_khz: 812
    spread_factor: 11
    coding_rate: 5
