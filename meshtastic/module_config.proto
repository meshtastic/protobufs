syntax = "proto3";

package meshtastic;

import "meshtastic/atak.proto";
import "meshtastic/channel.proto";
import "meshtastic/common.proto";

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "ModuleConfigProtos";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";

/*
 * MQTT Client Config
 */
message MQTTConfig {
  /*
   * MQTT behaviour toggles: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    MQTT_NONE = 0x00;
    /*
     * Gateway any channels marked is_uplink_enabled or is_downlink_enabled, when
     * this node can reach the internet.
     */
    MQTT_ENABLED = 0x01;
    /*
     * Send encrypted rather than decrypted packets. Only honoured when a custom
     * server is set; the default mqtt.meshtastic.org server handles encrypted
     * packets. Decrypted packets suit external systems consuming meshtastic traffic.
     */
    MQTT_ENCRYPTION = 0x02;
    /* Establish the connection using TLS */
    MQTT_TLS = 0x04;
    /* Proxy messages via the connected phone or client instead of connecting directly */
    MQTT_PROXY_TO_CLIENT = 0x08;
    /* Periodically report unencrypted information about this node to a map */
    MQTT_MAP_REPORTING = 0x10;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * The server to use for our MQTT global message gateway feature.
   * If not set, the default server will be used
   */
  string address = 2;

  /*
   * MQTT username to use (most useful for a custom MQTT server).
   * If using a custom server, this will be honoured even if empty.
   * If using the default server, this will only be honoured if set, otherwise the device will use the default username
   */
  string username = 3;

  /*
   * MQTT password to use (most useful for a custom MQTT server).
   * If using a custom server, this will be honoured even if empty.
   * If using the default server, this will only be honoured if set, otherwise the device will use the default password
   */
  string password = 4;

  /*
   * The root topic to use for MQTT messages. Default is "msh".
   * This is useful if you want to use a single MQTT server for multiple meshtastic networks and separate them via ACLs
   */
  string root = 5;

  /*
   * Settings for reporting information about our node to a map via MQTT
   */
  MapReportSettings map_report_settings = 6;
}

/*
 * Settings for reporting unencrypted information about our node to a map via MQTT
 */
message MapReportSettings {
  /*
   * How often we should report our info to the map (in seconds)
   */
  uint32 publish_interval_secs = 1;

  /*
   * Bits of precision for the location sent (default of 32 is full precision).
   */
  uint32 position_precision = 2;

  /*
   * Whether we have opted-in to report our location to the map
   */
  bool should_report_location = 3;
}

/*
 * RemoteHardwareModule Config
 */
message RemoteHardwareConfig {
  /*
   * Whether the Module is enabled
   */
  bool enabled = 1;

  /*
   * Whether the Module allows consumers to read / write to pins not defined in available_pins
   */
  bool allow_undefined_pin_access = 2;

  /*
   * Exposes the available pins to the mesh for reading and writing
   */
  repeated RemoteHardwarePin available_pins = 3;
}

/*
 * NeighborInfoModule Config
 */
message NeighborInfoConfig {
  /*
   * Whether the Module is enabled
   */
  bool enabled = 1;

  /*
   * Interval in seconds of how often we should try to send our
   * Neighbor Info (minimum is 14400, i.e., 4 hours)
   */
  uint32 update_interval = 2;

  /*
   * Whether in addition to sending it to MQTT and the PhoneAPI, our NeighborInfo should be transmitted over LoRa.
   * Note that this is not available on a channel with default key and name.
   */
  bool transmit_over_lora = 3;
}

/*
 * Detection Sensor Module Config
 */
message DetectionSensorConfig {
  enum TriggerType {
    // Event is triggered if pin is low
    LOGIC_LOW = 0;
    // Event is triggered if pin is high
    LOGIC_HIGH = 1;
    // Event is triggered when pin goes high to low
    FALLING_EDGE = 2;
    // Event is triggered when pin goes low to high
    RISING_EDGE = 3;
    // Event is triggered on every pin state change, low is considered to be
    // "active"
    EITHER_EDGE_ACTIVE_LOW = 4;
    // Event is triggered on every pin state change, high is considered to be
    // "active"
    EITHER_EDGE_ACTIVE_HIGH = 5;
  }
  /*
   * Detection sensor toggles: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    DETECTION_NONE = 0x00;
    /* The module is enabled */
    DETECTION_ENABLED = 0x01;
    /*
     * Send an ASCII bell with the alert message, useful for triggering an
     * external notification on bell.
     */
    DETECTION_SEND_BELL = 0x02;
    /*
     * Use INPUT_PULLUP mode for the GPIO pin. Only applicable when the board has
     * pull-up resistors on that pin.
     */
    DETECTION_USE_PULLUP = 0x04;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * Interval in seconds of how often we can send a message to the mesh when a
   * trigger event is detected
   */
  uint32 minimum_broadcast_secs = 2;

  /*
   * Interval in seconds of how often we should send a message to the mesh
   * with the current state regardless of trigger events When set to 0, only
   * trigger events will be broadcasted Works as a sort of status heartbeat
   * for peace of mind
   */
  uint32 state_broadcast_secs = 3;

  /*
   * Friendly name used to format message sent to mesh
   * Example: A name "Motion" would result in a message "Motion detected"
   * Maximum length of 20 characters
   */
  string name = 4;

  /*
   * GPIO pin to monitor for state changes
   */
  uint32 monitor_pin = 5;

  /*
   * The type of trigger event to be used
   */
  TriggerType detection_trigger_type = 6;
}

/*
 * Audio Config for codec2 voice
 */
message AudioConfig {
  /*
   * Baudrate for codec2 voice
   */
  enum Audio_Baud {
    /* Default codec2 bitrate */
    CODEC2_DEFAULT = 0;
    /* 3200 bps - highest quality */
    CODEC2_3200 = 1;
    /* 2400 bps */
    CODEC2_2400 = 2;
    /* 1600 bps */
    CODEC2_1600 = 3;
    /* 1400 bps */
    CODEC2_1400 = 4;
    /* 1300 bps */
    CODEC2_1300 = 5;
    /* 1200 bps */
    CODEC2_1200 = 6;
    /* 700 bps */
    CODEC2_700 = 7;
    /* 700B bps - lowest bitrate variant */
    CODEC2_700B = 8;
  }

  /*
   * Whether Audio is enabled
   */
  bool codec2_enabled = 1;

  /*
   * PTT Pin
   */
  uint32 ptt_pin = 2;

  /*
   * The audio sample rate to use for codec2
   */
  Audio_Baud bitrate = 3;

  /*
   * I2S Word Select
   */
  uint32 i2s_ws = 4;

  /*
   * I2S Data IN
   */
  uint32 i2s_sd = 5;

  /*
   * I2S Data OUT
   */
  uint32 i2s_din = 6;

  /*
   * I2S Clock
   */
  uint32 i2s_sck = 7;
}

/*
 * Config for the Paxcounter Module
 */
message PaxcounterConfig {
  /*
   * Enable the Paxcounter Module
   */
  bool enabled = 1;

  /*
   * Interval in seconds of how often we should try to send our
   * metrics to the mesh
   */
  uint32 paxcounter_update_interval = 2;

  /*
   * WiFi RSSI threshold. Defaults to -80
   */
  sint32 wifi_threshold = 3;

  /*
   * BLE RSSI threshold. Defaults to -80
   */
  sint32 ble_threshold = 4;
}

/*
 * Config for the Traffic Management module.
 * Provides packet inspection and traffic shaping to help reduce channel utilization
 */
message TrafficManagementConfig {
  /*
   * Minimum interval in seconds between position updates from the same node.
   * A non-zero value implicitly enables the suppression window; 0 disables it.
   */
  uint32 position_min_interval_secs = 1;

  /*
   * Maximum hop distance from the requestor at which direct NodeInfo responses
   * are served from the local cache. A non-zero value implicitly enables direct
   * response; 0 disables it.
   */
  uint32 nodeinfo_direct_response_max_hops = 2;

  /*
   * Time window in seconds for per-node rate limiting.
   * A non-zero value implicitly enables rate limiting; 0 disables it.
   */
  uint32 rate_limit_window_secs = 3;

  /*
   * Maximum packets allowed per node within the rate limit window.
   * A non-zero value implicitly enables rate limiting; 0 disables it.
   */
  uint32 rate_limit_max_packets = 4;

  /*
   * Maximum unknown/undecryptable packets per rate window before the source
   * is dropped. A non-zero value implicitly enables unknown-packet filtering;
   * 0 disables it.
   */
  uint32 unknown_packet_threshold = 5;
}

/*
 * Serial Config
 */
message SerialConfig {
  /*
   * Baud rate for serial module communication
   */
  enum Serial_Baud {
    BAUD_DEFAULT = 0;
    BAUD_110 = 1;
    BAUD_300 = 2;
    BAUD_600 = 3;
    BAUD_1200 = 4;
    BAUD_2400 = 5;
    BAUD_4800 = 6;
    BAUD_9600 = 7;
    BAUD_19200 = 8;
    BAUD_38400 = 9;
    BAUD_57600 = 10;
    BAUD_115200 = 11;
    BAUD_230400 = 12;
    BAUD_460800 = 13;
    BAUD_576000 = 14;
    BAUD_921600 = 15;
  }

  /*
   * Operating mode for the serial module
   */
  enum Serial_Mode {
    DEFAULT = 0;
    SIMPLE = 1;
    PROTO = 2;
    TEXTMSG = 3;
    NMEA = 4;
    // NMEA messages specifically tailored for CalTopo
    CALTOPO = 5;
    // Ecowitt WS85 weather station
    WS85 = 6;
    // VE.Direct is a serial protocol used by Victron Energy products
    // https://beta.ivc.no/wiki/index.php/Victron_VE_Direct_DIY_Cable
    VE_DIRECT = 7;
    // Used to configure and view some parameters of MeshSolar.
    // https://heltec.org/project/meshsolar/
    MS_CONFIG = 8;
    // Logs mesh traffic to the serial pins, ideal for logging via openLog or similar.
    LOG = 9; // includes other packets
    LOGTEXT = 10; // only text (channel & DM)
  }

  /*
   * Serial module toggles: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    SERIAL_NONE = 0x00;
    /* The module is enabled */
    SERIAL_ENABLED = 0x01;
    /* Echo received serial data back to the sender */
    SERIAL_ECHO = 0x02;
    /*
     * Override the platform's defacto Serial port instance and use the console
     * port for the serial module. Currently only usable in output modes like
     * NMEA / CalTopo, and may behave strangely or not at all in other modes.
     * Existing logging over the serial console is still present.
     */
    SERIAL_OVERRIDE_CONSOLE_PORT = 0x04;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * RX pin (should match Arduino gpio pin number)
   */
  uint32 rxd = 2;

  /*
   * TX pin (should match Arduino gpio pin number)
   */
  uint32 txd = 3;

  /*
   * Serial baud rate
   */
  Serial_Baud baud = 4;

  /*
   * Timeout in seconds for serial module operations (0 = no timeout)
   */
  uint32 timeout = 5;

  /*
   * Mode for serial module operation
   */
  Serial_Mode mode = 6;
}

/*
 * External Notifications Config
 */
message ExternalNotificationConfig {
  /*
   * Enable the ExternalNotificationModule
   */
  bool enabled = 1;

  /*
   * When using in On/Off mode, keep the output on for this many
   * milliseconds. Default 1000ms (1 second).
   */
  uint32 output_ms = 2;

  /*
   * Define the output pin GPIO setting Defaults to
   * EXT_NOTIFY_OUT if set for the board.
   * In standalone devices this pin should drive the LED to match the UI.
   */
  uint32 output = 3;

  /*
   * External notification behaviour: a bitwise OR of AlertFlags values.
   */
  enum AlertFlags {
    /* Nothing enabled */
    ALERT_NONE = 0x0000;
    /* Output pin is pulled active high; clear means active low */
    ALERT_ACTIVE = 0x0001;
    /* Alert on an incoming text message, via `output` */
    ALERT_MESSAGE = 0x0002;
    /* Alert on an incoming text message, via `output_vibra` */
    ALERT_MESSAGE_VIBRA = 0x0004;
    /* Alert on an incoming text message, via `output_buzzer` */
    ALERT_MESSAGE_BUZZER = 0x0008;
    /* Alert on a received bell character, via `output` */
    ALERT_BELL = 0x0010;
    /* Alert on a received bell character, via `output_vibra` */
    ALERT_BELL_VIBRA = 0x0020;
    /* Alert on a received bell character, via `output_buzzer` */
    ALERT_BELL_BUZZER = 0x0040;
    /* Drive the output with PWM instead of simple on/off */
    ALERT_USE_PWM = 0x0080;
    /* Use I2S audio output as the buzzer (e.g. T-Watch S3, T-Deck) */
    ALERT_USE_I2S_AS_BUZZER = 0x0100;
  }

  /*
   * Bitwise OR of AlertFlags values.
   */
  uint32 alert_flags = 4;

  /*
   * Optional: Define a secondary output pin for a vibra motor
   * This is used in standalone devices to match the UI.
   */
  uint32 output_vibra = 5;

  /*
   * Optional: Define a tertiary output pin for an active buzzer
   * This is used in standalone devices to match the UI.
   */
  uint32 output_buzzer = 6;

  /*
   * The notification will toggle with 'output_ms' for this time of seconds.
   * Default is 0 which means don't repeat at all. 60 would mean blink
   * and/or beep for 60 seconds
   */
  uint32 nag_timeout = 7;
}

/*
 * Store and Forward Module Config
 */
message StoreForwardConfig {
  /*
   * Store and forward toggles: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    STOREFORWARD_NONE = 0x00;
    /* The module is enabled */
    STOREFORWARD_ENABLED = 0x01;
    /* The server periodically broadcasts a heartbeat to indicate it is available */
    STOREFORWARD_HEARTBEAT = 0x02;
    /*
     * Act as a server that stores received messages and resends them on request,
     * rather than as a client.
     */
    STOREFORWARD_IS_SERVER = 0x04;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * Maximum number of message records to store on the server
   */
  uint32 records = 2;

  /*
   * Maximum number of messages the server will return in a single history request
   */
  uint32 history_return_max = 3;

  /*
   * Time window in seconds; only messages within this window will be returned in history requests
   */
  uint32 history_return_window = 4;
}

/*
 * Preferences for the RangeTestModule
 */
message RangeTestConfig {
  /*
   * Range test toggles: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    RANGETEST_NONE = 0x00;
    /* The module is enabled */
    RANGETEST_ENABLED = 0x01;
    /* Save a RangeTest.csv file. ESP32 only. */
    RANGETEST_SAVE = 0x02;
    /* Clean up and destroy the RangeTest.csv file on reboot. ESP32 only. */
    RANGETEST_CLEAR_ON_REBOOT = 0x04;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * Send out range test messages from this node
   */
  uint32 sender = 2;
}

/*
 * Configuration for both device and environment metrics
 */
message TelemetryConfig {
  /*
   * Which telemetry sources are collected, sent and shown on screen:
   * a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    TELEMETRY_NONE = 0x0000;
    /* Collect environment measurements */
    TELEMETRY_ENVIRONMENT_MEASUREMENT = 0x0001;
    /* Show environment measurements on the device screen */
    TELEMETRY_ENVIRONMENT_SCREEN = 0x0002;
    /*
     * Display environment temperatures in Fahrenheit. The sensor is always read in
     * Celsius; this is a display preference only.
     */
    TELEMETRY_ENVIRONMENT_DISPLAY_FAHRENHEIT = 0x0004;
    /* Collect air quality metrics */
    TELEMETRY_AIR_QUALITY = 0x0008;
    /* Show air quality metrics on the device screen */
    TELEMETRY_AIR_QUALITY_SCREEN = 0x0010;
    /* Collect power metrics */
    TELEMETRY_POWER_MEASUREMENT = 0x0020;
    /* Show power metrics on the device screen */
    TELEMETRY_POWER_SCREEN = 0x0040;
    /* Collect health metrics */
    TELEMETRY_HEALTH_MEASUREMENT = 0x0080;
    /* Show health metrics on the device screen */
    TELEMETRY_HEALTH_SCREEN = 0x0100;
    /*
     * Send device telemetry to the mesh. Telemetry still goes to the connected
     * phone or client over the API every minute regardless.
     */
    TELEMETRY_DEVICE = 0x0200;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * Interval in seconds of how often we should try to send our
   * device metrics to the mesh
   */
  uint32 device_update_interval = 2;

  /*
   * Interval in seconds of how often we should try to send sensor readings to the
   * mesh. One interval covers every sensor category, since they now travel together
   * in a single SensorReadings list rather than one packet per category.
   * Which categories are collected at all is set by the flags above.
   */
  uint32 sensor_update_interval = 3;
}

/*
 * Canned Messages Module Config
 */
message CannedMessageConfig {
  /*
   * Key codes for input events generated by the rotary encoder or button input broker
   */
  enum InputEventChar {
    /*
     * No input event
     */
    NONE = 0;

    /*
     * Navigate up (DC1 control character)
     */
    UP = 17;

    /*
     * Navigate down (DC2 control character)
     */
    DOWN = 18;

    /*
     * Navigate left (DC3 control character)
     */
    LEFT = 19;

    /*
     * Navigate right (DC4 control character)
     */
    RIGHT = 20;

    /*
     * Select/confirm (newline '\n')
     */
    SELECT = 10;

    /*
     * Go back (ESC character)
     */
    BACK = 27;

    /*
     * Cancel operation (CAN control character)
     */
    CANCEL = 24;
  }

  /*
   * Canned message input toggles: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    CANNEDMSG_NONE = 0x00;
    /*
     * Enable rotary encoder #1: a 'dumb' encoder sending pulses on both A and B
     * pins while rotating.
     */
    CANNEDMSG_ROTARY1 = 0x01;
    /*
     * Enable the Up/Down/Select input device. Can be a RAK rotary encoder or three
     * buttons, using the a/b/press definitions from inputbroker.
     */
    CANNEDMSG_UPDOWN1 = 0x02;
    /*
     * Also send a bell character with the messages, which
     * ExternalNotificationModule can act on.
     */
    CANNEDMSG_SEND_BELL = 0x04;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * GPIO pin for rotary encoder A port.
   */
  uint32 inputbroker_pin_a = 2;

  /*
   * GPIO pin for rotary encoder B port.
   */
  uint32 inputbroker_pin_b = 3;

  /*
   * GPIO pin for rotary encoder Press port.
   */
  uint32 inputbroker_pin_press = 4;

  /*
   * Generate input event on CW of this kind.
   */
  InputEventChar inputbroker_event_cw = 5;

  /*
   * Generate input event on CCW of this kind.
   */
  InputEventChar inputbroker_event_ccw = 6;

  /*
   * Generate input event on Press of this kind.
   */
  InputEventChar inputbroker_event_press = 7;
}

/*
   Ambient Lighting Module - Settings for control of onboard LEDs to allow users to adjust the brightness levels and respective color levels.
   Initially created for the RAK14001 RGB LED module.
*/
message AmbientLightingConfig {
  /*
   * Sets LED to on or off.
   */
  bool led_state = 1;

  /*
   * Sets the current for the LED output. Default is 10.
   */
  uint32 current = 2;

  /*
   * Sets the red LED level. Values are 0-255.
   */
  uint32 red = 3;

  /*
   * Sets the green LED level. Values are 0-255.
   */
  uint32 green = 4;

  /*
   * Sets the blue LED level. Values are 0-255.
   */
  uint32 blue = 5;
}

/*
 * StatusMessage config - Allows setting a status message for a node to periodically rebroadcast
 */
message StatusMessageConfig {
  /*
   * The actual status string
   */
  string node_status = 1;
}

/*
 * MeshBeacon module config
 */
message MeshBeaconConfig {
  /*
   * Boolean options for the beacon module, packed into the `flags` bitfield below.
   * OR the FLAG_* values together; a flag is on when its bit is set.
   */
  enum Flags {
    /*
     * No options enabled.
     */
    FLAG_NONE = 0;

    /*
     * Enable receiving MESH_BEACON_APP packets from other nodes.
     * The text portion is delivered to the local message inbox.
     * Offered channel/preset are stored for the client app to act on.
     */
    FLAG_LISTEN_ENABLED = 1;

    /*
     * Enable periodically broadcasting MESH_BEACON_APP packets from this node.
     */
    FLAG_BROADCAST_ENABLED = 2;

    /*
     * When both text and offer content are present, split the beacon into a separate
     * MESH_BEACON_APP (offer only) and TEXT_MESSAGE_APP (text only) packet, so firmware
     * that only decodes TEXT_MESSAGE_APP still receives the human-readable text.
     */
    FLAG_LEGACY_SPLIT = 4;
  }

  /*
   * One entry in the broadcast destination list.
   * Each entry names one set of radio settings to send a beacon copy on.
   */
  message BroadcastTarget {
    /*
     * Modem preset to use for this target.
     * Falls back to the running config preset if unset.
     */
    optional ModemPreset preset = 1;

    /*
     * Region to use for this target. REGION_UNSET means use the running config region.
     */
    RegionCode region = 2;

    /*
     * Index into the device's channel table (0..MAX_NUM_CHANNELS-1) of the channel to
     * transmit this target's beacon on. The referenced channel must already be configured
     * on the node (its key is needed to encrypt). If unset, the default channel for the
     * preset is used.
     */
    optional uint32 channel_index = 3;
  }

  /*
   * Bitwise-OR of Flags values (listen / broadcast / legacy-split toggles).
   */
  uint32 flags = 1;

  /*
   * Message to include in each beacon broadcast. Max 100 bytes enforced by firmware.
   */
  string broadcast_message = 2;

  /*
   * Optional channel (name + PSK) to advertise in the MeshBeacon offer_channel field.
   */
  ChannelSettings broadcast_offer_channel = 3;

  /*
   * Optional region to advertise in the MeshBeacon offer_region field.
   */
  RegionCode broadcast_offer_region = 4;

  /*
   * Optional modem preset to advertise in the MeshBeacon offer_preset field.
   */
  optional ModemPreset broadcast_offer_preset = 5;

  /*
   * How often to broadcast, in seconds. Min 3600 (1 h), default 3600.
   */
  uint32 broadcast_interval_secs = 6;

  /*
   * Broadcast destination list.
   * The broadcaster sends one beacon copy per distinct destination, in sequence, temporarily
   * switching the radio to that entry's preset/region/channel for each.
   * When empty, a single beacon is sent on the node's running preset and region over the
   * primary channel.
   * Entries that resolve to the same effective preset, region and channel are deduplicated, so
   * a duplicate entry does not produce a second transmission.
   */
  repeated BroadcastTarget broadcast_targets = 7;
}

/*
 * TAK team/role configuration
 */
message TAKConfig {
  /*
   * Team color.
   * Default Unspecifed_Color -> firmware uses Cyan
   */
  Team team = 1;
  /*
   * Member role.
   * Default Unspecifed -> firmware uses TeamMember
   */
  MemberRole role = 2;
}

/*
 * A GPIO pin definition for remote hardware module
 */
message RemoteHardwarePin {
  /*
   * GPIO Pin number (must match Arduino)
   */
  uint32 gpio_pin = 1;

  /*
   * Name for the GPIO pin (i.e. Front gate, mailbox, etc)
   */
  string name = 2;

  /*
   * Type of GPIO access available to consumers on the mesh
   */
  RemoteHardwarePinType type = 3;
}

enum RemoteHardwarePinType {
  /*
   * Unset/unused
   */
  UNKNOWN = 0;

  /*
   * GPIO pin can be read (if it is high / low)
   */
  DIGITAL_READ = 1;

  /*
   * GPIO pin can be written to (high / low)
   */
  DIGITAL_WRITE = 2;
}

/*
 * Wrapper message for admin transport of module configuration
 */
message ModuleConfigPayload {
  oneof payload_variant {
    MQTTConfig mqtt = 1;
    SerialConfig serial = 2;
