   * a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    TELEMETRY_NONE = 0x0000;
    /* Collect environment measurements */
    TELEMETRY_ENVIRONMENT_MEASUREMENT = 0x0001 [(meshtastic.enum_value_metadata) = {
      label: "Environment Metrics Enabled"
      description: "Collect environment measurements"
    }];
    /* Show environment measurements on the device screen */
    TELEMETRY_ENVIRONMENT_SCREEN = 0x0002 [(meshtastic.enum_value_metadata) = {
      label: "Show on device screen"
      description: "Display environment measurements on device"
    }];
    /* Collect air quality metrics */
    TELEMETRY_AIR_QUALITY = 0x0008 [(meshtastic.enum_value_metadata) = {
      label: "Air Quality Metrics Enabled"
      description: "Collect air quality metrics"
    }];
    /* Show air quality metrics on the device screen */
    TELEMETRY_AIR_QUALITY_SCREEN = 0x0010 [(meshtastic.enum_value_metadata) = {since_firmware: "2.7.18"}];
    /* Collect power metrics */
    TELEMETRY_POWER_MEASUREMENT = 0x0020 [(meshtastic.enum_value_metadata) = {
      label: "Power Measurement Enabled"
      description: "Collect power metrics"
    }];
    /* Show power metrics on the device screen */
    TELEMETRY_POWER_SCREEN = 0x0040 [(meshtastic.enum_value_metadata) = {
      label: "Power Screen"
      description: "Display power metrics on device"
    }];
    /* Collect health metrics */
    TELEMETRY_HEALTH_MEASUREMENT = 0x0080;
    /* Show health metrics on the device screen */
    TELEMETRY_HEALTH_SCREEN = 0x0100;
    /*
     * Send device telemetry to the mesh. Telemetry still goes to the connected
     * phone or client over the API every minute regardless.
     */
    TELEMETRY_DEVICE = 0x0200 [(meshtastic.enum_value_metadata) = {
      label: "Broadcast Device Metrics"
      description: "Enable broadcasting device metrics to the mesh network. When disabled, metrics are only sent to connected clients."
      since_firmware: "2.7.13"
    }];
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * Interval in seconds of how often we should try to send our
   * device metrics to the mesh
   */
  uint32 device_update_interval = 2 [(meshtastic.field_metadata) = {
    label: "Device Metrics Interval"
    unit: "s"
    description: "How often device metrics are sent over the mesh."
  }];

  /*
   * Interval in seconds of how often we should try to send sensor readings to the
   * mesh. One interval covers every sensor category, since they now travel together
   * in a single SensorReadings list rather than one packet per category.
   * Which categories are collected at all is set by the flags above.
   */
  uint32 sensor_update_interval = 3;
}

