    MQTTConfig mqtt = 1;
    SerialConfig serial = 2;
    ExternalNotificationConfig external_notification = 3;
    StoreForwardConfig store_forward = 4;
    TelemetryConfig telemetry = 5;
    CannedMessageConfig canned_message = 6;
    AudioConfig audio = 7;
    RemoteHardwareConfig remote_hardware = 8;
    NeighborInfoConfig neighbor_info = 9;
    AmbientLightingConfig ambient_lighting = 10;
    DetectionSensorConfig detection_sensor = 11;
    PaxcounterConfig paxcounter = 12;
    StatusMessageConfig statusmessage = 13 [(meshtastic.field_metadata) = {since_firmware: "2.7.20"}];
    TrafficManagementConfig traffic_management = 14 [(meshtastic.field_metadata) = {since_firmware: "2.8.0"}];
    TAKConfig tak = 15 [(meshtastic.field_metadata) = {since_firmware: "2.8.0"}];
    MeshBeaconConfig mesh_beacon = 16 [(meshtastic.field_metadata) = {since_firmware: "2.8.0"}];
  }
}
