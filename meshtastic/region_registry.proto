syntax = "proto3";

package meshtastic;

import "meshtastic/common.proto";

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "RegionRegistryProtos";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";

/*
 * Region Registry
 *
 * NOT used on-wire; consumed by clients/apps and optionally embedded in firmware.
 * Centralizes the regulatory regions, the profiles they share and the modem presets
 * each profile permits.
 *
 * Each fact is stated in exactly one table, and tables refer to each other by name:
 *
 *   RegionInfo       band, duty cycle, power limit, slot      -> one RegionProfile
 *   RegionProfile    slot layout, audio, licensing,
 *                    throttles, default preset                -> one ModemPresetList
 *   ModemPresetList  the presets a profile permits            -> ModemPreset values
 *   RegionSwapGroup  regions a preset moves a node between    -> RegionCode values
 *
 * Many regions share one profile, and profiles can share one preset list: NARROW
 * and HAM_100KHZ permit the same presets and differ in licensing, padding and
 * audio. Whatever follows from the tables is not stored, such as a preset being
 * reachable only by licensed operators, or the presets a swap group offers.
 *
 * The radio parameters of each preset are in modem_preset_registry.proto.
 *
 * Data lives in registry/regions.yaml. tools/gen_registry.py validates it and
 * generates registry/generated/regions.json, which `buf convert` serializes.
 * Firmware can generate its region table from this data or embed it directly.
 */

/*
 * Regulatory region definition
 */
message RegionInfo {
  /* Which region this defines */
  RegionCode region_code = 1;

  /* Name of the RegionProfile this region uses */
  string profile = 2;

  /*
   * Frequency range start in MHz x100 (e.g. 90200 = 902.00 MHz). A finer band edge
   * is rounded down, 433.075 MHz to 43307; firmware holds the exact value.
   */
  uint32 freq_start_mhz_x100 = 3;

  /* Frequency range end in MHz x100 (e.g. 92800 = 928.00 MHz), rounded down */
  uint32 freq_end_mhz_x100 = 4;

  /*
   * Duty cycle percentage (1-100, where 100 = no duty cycle restriction). A
   * fractional limit is rounded down, 2.5% to 2; firmware holds the exact value.
   */
  uint32 duty_cycle = 5;

  /*
   * Duty cycle percentage for a node in the ROUTER role, where regulation grants it
   * more airtime than other nodes. 0 = duty_cycle applies to every role.
   */
  uint32 router_duty_cycle = 6;

  /* Maximum TX power in dBm. A licensed operator (User.is_licensed) may exceed it. */
  uint32 power_limit_dbm = 7;

  /* Whether frequency hopping/switching is allowed */
  bool frequency_switching = 8;

  /*
   * Whether this region uses wide LoRa. The boundary is 1 GHz: narrow LoRa is sub-GHz,
   * wide LoRa above it, and newer chips reach 6 GHz. A wide region needs a
   * wide-capable radio, and its presets use their wide_bandwidth_khz. Kept as its own
   * field rather than read from the frequency range, because frequency mixing, or
   * tuning a wideband transmitter, can open ranges where the band does not decide it.
   */
  bool wide_lora = 9;

  /*
   * Frequency slot used while the user has not chosen one:
   *   0      the hash of the primary channel name picks the slot
   *   -1     the hash of the preset name picks the slot
   *   N > 0  slot N, counted from 1
   */
  sint32 override_slot = 10;
}

/*
 * Parameters shared by every region that uses the profile
 */
message RegionProfile {
  /* Name regions refer to this profile by, e.g. "STD", "HAM_20KHZ" */
  string name = 1;

  /* Name of the ModemPresetList this profile permits */
  string preset_list = 2;

  /*
   * Preset a region selects when none is set or the current one is not permitted.
   * One of the presets in preset_list.
   */
  ModemPreset default_preset = 3;

  /* Gap between adjacent frequency slots in kHz, rounded down */
  uint32 spacing_khz = 4;

  /*
   * Guard band on each side of a frequency slot in kHz, rounded down. It widens the
   * slot beyond the preset bandwidth, placing 62.5 kHz presets on a 100 kHz raster.
   */
  uint32 padding_khz = 5;

  /* Whether audio mode is permitted */
  bool audio_permitted = 6;

  /*
   * Only a licensed operator (User.is_licensed) may select a region using this
   * profile; firmware rejects the region otherwise.
   */
  bool licensed_only = 7;

  /* Multiplier on the position broadcast interval; 0 and 1 leave it unchanged */
  uint32 position_throttle = 8;

  /* Multiplier on the telemetry broadcast interval; 0 and 1 leave it unchanged */
  uint32 telemetry_throttle = 9;
}

/*
 * A set of modem presets, shared by every profile that permits exactly this set
 */
message ModemPresetList {
  /* Name profiles refer to this list by, e.g. "STD", "NARROW" */
  string name = 1;

  /* The presets, in ModemPreset order */
  repeated ModemPreset presets = 2;
}

/*
 * EU short-range device regions a node moves between by preset. Members permit
 * mutually exclusive preset lists: selecting a preset that only a sibling permits
 * switches the node to that sibling region, so a client offers the union of the
 * members' presets in each of them.
 *
 * Members need not share a frequency range. EU_868 and EU_N_868 overlap, while
 * EU_866 is a bespoke RFID band that overlaps neither. EU_874 and EU_917 follow
 * the same pattern if they are allocated.
 */
message RegionSwapGroup {
  /* The member regions */
  repeated RegionCode regions = 1;
}

/*
 * The complete region registry
 */
message RegionRegistry {
  /* Every region with a definition */
  repeated RegionInfo regions = 1;

  /* Every profile a region uses */
  repeated RegionProfile profiles = 2;

  /* Every preset list a profile uses */
  repeated ModemPresetList preset_lists = 3;

  /* Every group of regions that swap into each other */
  repeated RegionSwapGroup swap_groups = 4;

  /*
   * Raised by every change to the data. CI rejects a change that leaves it where it
   * was, so a client can tell whether its bundled copy is current.
   */
  uint32 revision = 5;
}
