syntax = "proto3";

package meshtastic;

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "DeviceUIProtos";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";

/*
 * Protobuf structures for device-ui persistency
 */

message DeviceUIConfig {
  /*
   * A version integer used to invalidate saved files when we make incompatible changes.
   */
  uint32 version = 1;

  /*
   * TFT display brightness 1..255
   */
  uint32 screen_brightness = 2;

  /*
   * Screen timeout 0..900
   */
  uint32 screen_timeout = 3;

  /*
   * Device UI toggles: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    UI_NONE = 0x00;
    /* The screen is locked */
    UI_SCREEN_LOCK = 0x01;
    /* The settings are locked */
    UI_SETTINGS_LOCK = 0x02;
    /* Audible message alerts are enabled */
    UI_ALERT_ENABLED = 0x04;
    /* Banners are enabled */
    UI_BANNER_ENABLED = 0x08;
    /* Draw the clockface as analog rather than digital */
    UI_IS_CLOCKFACE_ANALOG = 0x10;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 4;

  /*
   * Screen/Settings unlock code
   */
  uint32 pin_code = 5;

  /*
   * Color theme
   */
  Theme theme = 6;

  /*
   * Ring tone selection
   */
  uint32 ring_tone_id = 7;

  /*
   * Localization
   */
  Language language = 8;

  /*
   * Node list filter
   */
  NodeFilter node_filter = 9;

  /*
   * Node list highlightening
   */
  NodeHighlight node_highlight = 10;

  /*
   * 8 integers for screen calibration data
   */
  bytes calibration_data = 11;

  /*
   * Map related data
   */
  Map map_data = 12;

  /*
   * Compass mode
   */
  CompassMode compass_mode = 13;

  /*
   * RGB color for BaseUI
   * 0xRRGGBB format, e.g. 0xFF0000 for red
   */
  uint32 screen_rgb_color = 14;

  /*
   * How the GPS coordinates are formatted on the OLED screen.
   */
  GpsCoordinateFormat gps_format = 15;

  /*
   * How the GPS coordinates are displayed on the OLED screen.
   */
  enum GpsCoordinateFormat {
    /*
     * GPS coordinates are displayed in the normal decimal degrees format:
     * DD.DDDDDD DDD.DDDDDD
     */
    DEC = 0;

    /*
     * GPS coordinates are displayed in the degrees minutes seconds format:
     * DD°MM'SS"C DDD°MM'SS"C, where C is the compass point representing the locations quadrant
     */
    DMS = 1;

    /*
     * Universal Transverse Mercator format:
     * ZZB EEEEEE NNNNNNN, where Z is zone, B is band, E is easting, N is northing
     */
    UTM = 2;

    /*
     * Military Grid Reference System format:
     * ZZB CD EEEEE NNNNN, where Z is zone, B is band, C is the east 100k square, D is the north 100k square,
     * E is easting, N is northing
     */
    MGRS = 3;

    /*
     * Open Location Code (aka Plus Codes).
     */
    OLC = 4;

    /*
     * Ordnance Survey Grid Reference (the National Grid System of the UK).
     * Format: AB EEEEE NNNNN, where A is the east 100k square, B is the north 100k square,
     * E is the easting, N is the northing
     */
    OSGR = 5;

    /*
     * Maidenhead Locator System
     * Described here: https://en.wikipedia.org/wiki/Maidenhead_Locator_System
     */
    MLS = 6;
  }
}

message NodeFilter {
  /*
   * Which node classes pass the filter: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing filtered in */
    FILTER_NONE = 0x00;
    /* Include unknown nodes */
    FILTER_UNKNOWN = 0x01;
    /* Include offline nodes */
    FILTER_OFFLINE = 0x02;
    /* Include nodes without a public key */
    FILTER_PUBLIC_KEY = 0x04;
    /* Include nodes without a position */
    FILTER_POSITION = 0x08;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * Filter based on hops away
   */
  int32 hops_away = 2;

  /*
   * Filter nodes by matching name string
   */
  string node_name = 3;

  /*
   * Filter based on channel
   */
  int32 channel = 4;
}

message NodeHighlight {
  /*
   * Which node activity to highlight: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing highlighted */
    HIGHLIGHT_NONE = 0x00;
    /* Highlight nodes with active chat */
    HIGHLIGHT_CHAT = 0x01;
    /* Highlight nodes with a position */
    HIGHLIGHT_POSITION = 0x02;
    /* Highlight nodes with telemetry data */
    HIGHLIGHT_TELEMETRY = 0x04;
    /* Highlight nodes with IAQ data */
    HIGHLIGHT_IAQ = 0x08;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * Highlight nodes by matching name string
   */
  string node_name = 2;
}

message GeoPoint {
  /*
   * Zoom level
   */
  int32 zoom = 1;

  /*
   * Coordinate: latitude
   */
  int32 latitude = 2;

  /*
   * Coordinate: longitude
   */
  int32 longitude = 3;
}

message Map {
  /*
   * Home coordinates
   */
  GeoPoint home = 1;

  /*
   * Map tile style
   */
  string style = 2;

  /*
   * Map scroll follows GPS
   */
  bool follow_gps = 3;
}

enum CompassMode {
  /*
   * Compass with dynamic ring and heading
   */
  DYNAMIC = 0;

  /*
   * Compass with fixed ring and heading
   */
  FIXED_RING = 1;

  /*
   * Compass with heading and freeze option
   */
  FREEZE_HEADING = 2;
}

enum Theme {
  /*
   * Dark
   */
  DARK = 0;
  /*
   * Light
   */
  LIGHT = 1;
  /*
   * Red
   */
  RED = 2;
}

/*
 * Localization
 */
enum Language {
  /*
   * English
   */
  ENGLISH = 0;

  /*
   * French
   */
  FRENCH = 1;

  /*
   * German
   */
  GERMAN = 2;

  /*
   * Italian
   */
  ITALIAN = 3;

  /*
   * Portuguese
   */
  PORTUGUESE = 4;

  /*
   * Spanish
   */
  SPANISH = 5;

  /*
   * Swedish
   */
  SWEDISH = 6;

  /*
   * Finnish
   */
  FINNISH = 7;

  /*
   * Polish
   */
  POLISH = 8;

  /*
   * Turkish
   */
  TURKISH = 9;

  /*
   * Serbian
   */
  SERBIAN = 10;

  /*
   * Russian
   */
  RUSSIAN = 11;

  /*
   * Dutch
   */
  DUTCH = 12;

  /*
   * Greek
   */
  GREEK = 13;

  /*
   * Norwegian
   */
  NORWEGIAN = 14;

  /*
   * Slovenian
   */
  SLOVENIAN = 15;

  /*
   * Ukrainian
   */
  UKRAINIAN = 16;

  /*
   * Bulgarian
   */
  BULGARIAN = 17;

  /*
   * Czech
   */
  CZECH = 18;

  /*
   * Danish
   */
  DANISH = 19;

  /*
   * Simplified Chinese (experimental)
   */
  SIMPLIFIED_CHINESE = 30;

  /*
   * Traditional Chinese (experimental)
   */
  TRADITIONAL_CHINESE = 31;
}
