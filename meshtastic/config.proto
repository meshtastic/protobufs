/*
 * Lora Config
 */
message LoRaConfig {
  /*
   * Whether a front-end module / low-noise amplifier is fitted and in use
   */
  enum FEM_LNA_Mode {
    /*
     * FEM_LNA is present but disabled
     */
    DISABLED = 0;

    /*
     * FEM_LNA is present and enabled
     */
    ENABLED = 1;

    /*
     * FEM_LNA is not present on the device
     */
    NOT_PRESENT = 2;
  }

  /*
   * LoRa radio toggles: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    LORA_NONE = 0x00;
    /*
     * Adhere to the modem_preset field. When clear, bandwidth, spread_factor and
     * coding_rate are taken from their manually defined fields instead.
     */
    LORA_USE_PRESET = 0x01 [(meshtastic.enum_value_metadata) = {
      label: "Use Preset"
      description: "Use the modem preset settings instead of a manual bandwidth, spread factor and coding rate"
    }];
    /*
     * Allow the LoRa radio to transmit. Clearing this disables TX, which is useful
     * for hot-swapping antennas and other tests.
     */
    LORA_TX_ENABLED = 0x02 [(meshtastic.enum_value_metadata) = {
      label: "Transmit Enabled"
      description: "Allow the LoRa radio to transmit. Turn off while hot-swapping antennas or bench testing."
    }];
    /*
     * Exceed duty cycle limits. You are then possibly not following local
     * regulations unless you are a HAM. No effect where the region duty cycle is 100%.
     */
    LORA_OVERRIDE_DUTY_CYCLE = 0x04 [(meshtastic.enum_value_metadata) = {label: "Override Duty Cycle"}];
    /* Set RX boosted gain mode on SX126X-based radios */
    LORA_SX126X_RX_BOOSTED_GAIN = 0x08 [(meshtastic.enum_value_metadata) = {
      label: "RX Boosted Gain"
      description: "Enable RX boosted gain mode on SX126X based radios"
    }];
    /* Disable the built-in PA fan driven by the pin defined in RF95_FAN_EN */
    LORA_PA_FAN_DISABLED = 0x10 [(meshtastic.enum_value_metadata) = {label: "PA Fan Disabled"}];
    /*
     * Drop packets received over LoRa that passed via MQTT anywhere on the path
     * towards this node.
     */
    LORA_IGNORE_MQTT = 0x20 [(meshtastic.enum_value_metadata) = {
      label: "Ignore MQTT"
      description: "Ignore packets received over LoRa that travelled via MQTT anywhere on their path."
    }];
    /* Set the ok_to_mqtt bit on outgoing packets */
    LORA_CONFIG_OK_TO_MQTT = 0x40 [(meshtastic.enum_value_metadata) = {label: "Ok to MQTT"}];
    /*
     * Do not use radiolib to initialize the radio; listen for a serialHal
     * connection instead.
     */
    LORA_SERIAL_HAL_ONLY = 0x80;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * The preset the radio uses when LORA_USE_PRESET is set. When it is clear,
   * bandwidth, spread_factor and coding_rate define the radio instead, and this field
   * does not configure it.
   */
  ModemPreset modem_preset = 2 [(meshtastic.field_metadata) = {label: "Presets"}];

  /*
   * Bandwidth in kHz, used when LORA_USE_PRESET is clear. 0 selects the default,
   * 250 kHz. Fractional bandwidths are stored as codes: 8 = 7.8, 10 = 10.4,
   * 16 = 15.6, 21 = 20.8, 31 = 31.25, 42 = 41.7, 62 = 62.5, 200 = 203.125,
   * 400 = 406.25, 800 = 812.5 and 1600 = 1625 kHz; any other value is kHz as it
   * stands. Not every LoRa chip supports every bandwidth, the narrow ones such as
   * 31.25 kHz least of all, and the radio driver rejects one the chip cannot use.
   */
  uint32 bandwidth = 3 [(meshtastic.field_metadata) = {
    label: "Bandwidth"
    unit: "kHz"
  }];

  /*
   * Spreading factor, 5 to 12, used when LORA_USE_PRESET is clear: a symbol is
   * 1 << spread_factor chirps. Not every LoRa chip supports SF5 and SF6; on an
   * SX127x-class radio firmware uses the default, 11, instead, as it does for a value
   * out of range.
   */
  uint32 spread_factor = 4 [(meshtastic.field_metadata) = {
    label: "Spread Factor"
    description: "Number of chirps per symbol, as 2 raised to this value."
    min_value: 5
    max_value: 12
  }];

  /*
   * The denominator of the coding rate.
   * ie for 4/5, the value is 5. 4/8 the value is 8.
   *
   * With LORA_USE_PRESET clear this is the coding rate, clamped to 5 through 8.
   *
   * With LORA_USE_PRESET set, this raises the preset's coding rate when it is 5 through 8
   * and higher than the preset's own. A lower value, a value out of range, and 0 all leave
   * the preset's coding rate in place, so 0 is how a client says "use the preset's".
   * Bandwidth and spread factor still come from the preset, and the coding rate travels in
   * the explicit LoRa header, so nodes on the same preset hear each other either way.
   *
   * No bound is stated here because the valid set differs between the two cases: 5 through 8
   * with the preset off, and 0 plus anything above the preset's own coding rate up to 8 with
   * it on.
   */
  uint32 coding_rate = 5 [(meshtastic.field_metadata) = {
    label: "Coding Rate"
    description: "Error-correction redundancy, as the denominator of 4/n. Higher values survive noisier links but make every packet longer."
  }];

  /*
   * This parameter is for advanced users with advanced test equipment, we do not recommend most users use it.
   * A frequency offset that is added to to the calculated band center frequency.
   * Used to correct for crystal calibration errors.
   * Units are in Hz.
   */
  sint32 frequency_offset = 6;

  /*
   * The region code for the radio (US, CN, EU433, etc...)
   */
  RegionCode region = 7 [(meshtastic.field_metadata) = {
    label: "Region"
    description: "The region where you will be using your radios."
  }];

  /*
   * Hop budget for packets this node originates: 0-15, the four bits of the v3
   * header's hop_limit. Default of 3.
   * Attempting to set a value above 15 results in the default.
   */
  uint32 hop_limit = 8 [(meshtastic.field_metadata) = {
    label: "Hop Limit"
    description: "How many times a message may be repeated before it stops being forwarded."
    keywords: "hops|ttl|range|rebroadcast"
    min_value: 0
    max_value: 15
  }];

  /*
   * If zero, then use default max legal continuous power (ie. something that won't
   * burn out the radio hardware)
   * In most cases you should use zero here.
   * Units are in dBm.
   */
  sint32 tx_power = 9 [(meshtastic.field_metadata) = {
    label: "Transmit Power"
    description: "Radio transmit power. Leave at zero to use the highest level legal for the region, which is what most radios should use."
    keywords: "tx|power|dbm|output|gain"
    unit: "dBm"
    min_value: 0
    max_value: 30
  }];

  /*
   * The frequency slot the radio transmits and listens on. This is the one statement of
   * how a slot is chosen; other fields point here.
   *
   * N > 0  slot N, counted from 1, chosen by the user.
   * 0      derive it: slot = hash(name) % slot_count + 1, where name is what the
   *        region's RegionInfo.override_slot selects - the primary channel's name, or
   *        the modem preset's name from ModemPresetInfo.name. An empty primary channel
   *        name means the preset name, so the two agree on a default channel.
   *
   * slot_count is the total of the region's slot plan (SCHEMA.md section 6) for the
   * bandwidth in use, so it depends on region and preset, not on this field. Most users
   * never see this concept.
   */
  uint32 channel_num = 10 [(meshtastic.field_metadata) = {
    label: "Frequency Slot"
    description: "Your nodeâ€™s operating frequency is calculated based on the region, modem preset, and this field. When 0, the slot is automatically calculated based on the primary channel name."
  }];

  /*
   * This parameter is for advanced users and licensed HAM radio operators.
   * Ignore Channel Calculation and use this frequency instead. The frequency_offset
   * will still be applied. This will allow you to use out-of-band frequencies.
   * Please respect your local laws and regulations. If you are a HAM, make sure you
   * enable HAM mode and turn off encryption.
   * Units are in Hz.
   */
  uint32 override_frequency = 11 [(meshtastic.field_metadata) = {label: "Frequency Override"}];

  /*
   * Set where LORA FEM is enabled, disabled, or not present
   */
  FEM_LNA_Mode fem_lna_mode = 12 [(meshtastic.field_metadata) = {since_firmware: "2.7.20"}];
}

message BluetoothConfig {
  enum PairingMode {
    /*
     * Device generates a random PIN that will be shown on the screen of the device for pairing
     */
    RANDOM_PIN = 0 [(meshtastic.enum_value_metadata) = {label: "Random Pin"}];

    /*
     * Device requires a specified fixed PIN for pairing
     */
    FIXED_PIN = 1 [(meshtastic.enum_value_metadata) = {label: "Fixed Pin"}];

    /*
     * Device requires no PIN for pairing
     */
    NO_PIN = 2 [(meshtastic.enum_value_metadata) = {label: "No PIN (Just Works)"}];
  }

  /*
   * Enable Bluetooth on the device
   */
  bool enabled = 1 [(meshtastic.field_metadata) = {
    label: "Bluetooth Enabled"
    description: "Enable Bluetooth on the device"
  }];

  /*
   * Determines the pairing strategy for the device
   */
  PairingMode mode = 2 [(meshtastic.field_metadata) = {
    label: "Pairing Mode"
    description: "Bluetooth pairing strategy"
  }];

  /*
   * Specified PIN for PairingMode.FixedPin
