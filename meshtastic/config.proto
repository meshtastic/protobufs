syntax = "proto3";

package meshtastic;

import "meshtastic/common.proto";
import "meshtastic/field_metadata.proto";

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "ConfigProtos";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";

/*
 * Configuration
 */
message DeviceConfig {
  /*
   * Defines the device's behavior for how messages are rebroadcast
   */
  enum RebroadcastMode {
    /*
     * Default behavior.
     * Rebroadcast any observed message, if it was on our private channel or from another mesh with the same lora params.
     */
    ALL = 0 [(meshtastic.enum_value_metadata) = {
      label: "All"
      description: "Rebroadcast any observed message, if it was on our private channel or from another channel with the same lora params."
    }];

    /*
     * Rebroadcast everything without decoding it first. The firmware treats it as ALL on every role.
     */
    ALL_SKIP_DECODING = 1 [(meshtastic.enum_value_metadata) = {
      label: "All Skip Decoding"
      description: "Treated as ALL."
    }];

    /*
     * Ignores observed messages from foreign meshes that are open or those which it cannot decrypt.
     * Only rebroadcasts message on the nodes local primary / secondary channels.
     */
    LOCAL_ONLY = 2 [(meshtastic.enum_value_metadata) = {
      label: "Local Only"
      description: "Ignores observed messages from foreign meshes that are open or those which it cannot decrypt. Only rebroadcasts message on the nodes local primary / secondary channels."
    }];

    /*
     * Ignores observed messages from foreign meshes like LOCAL_ONLY,
     * but takes it step further by also ignoring messages from nodenums not in the node's known list (NodeDB)
     */
    KNOWN_ONLY = 3 [(meshtastic.enum_value_metadata) = {
      label: "Known Only"
      description: "Ignores observed messages from foreign meshes like Local Only, but takes it step further by also ignoring messages from nodes not already in the node's known list."
    }];

    /*
     * Relay nothing. Refused on a ROUTER.
     */
    NONE = 4 [(meshtastic.enum_value_metadata) = {
      label: "None"
      description: "Never rebroadcast. Not available on a router."
    }];

    /*
     * Ignores packets from non-standard portnums such as: TAK, PaxCounter, etc.
     * Only rebroadcasts packets with standard portnums: NodeInfo, Text, Position, Telemetry, and Routing.
     */
    CORE_PORTNUMS_ONLY = 5 [(meshtastic.enum_value_metadata) = {
      label: "Core Portnums Only"
      description: "Only rebroadcasts packets from the core portnums: NodeInfo, Text, Position, Telemetry, and Routing."
    }];
  }

  /*
   * Defines buzzer behavior for audio feedback
   */
  enum BuzzerMode {
    /*
     * Default behavior.
     * Buzzer is enabled for all audio feedback including button presses and alerts.
     */
    ALL_ENABLED = 0;

    /*
     * Disabled.
     * All buzzer audio feedback is disabled.
     */
    DISABLED = 1;

    /*
     * Notifications Only.
     * Buzzer is enabled only for notifications and alerts, but not for button presses.
     * External notification config determines the specifics of the notification behavior.
     */
    NOTIFICATIONS_ONLY = 2;

    /*
     * Non-notification system buzzer tones only.
     * Buzzer is enabled only for non-notification tones such as button presses, startup, shutdown, but not for alerts.
     */
    SYSTEM_ONLY = 3;

    /*
     * Direct Message notifications only.
     * Buzzer is enabled only for direct messages and alerts, but not for button presses.
     * External notification config determines the specifics of the notification behavior.
     */
    DIRECT_MSG_ONLY = 4;
  }

  /*
   * Sets the role of node
   */
  Role role = 1 [(meshtastic.field_metadata) = {label: "Device Role"}];

  /*
   * For boards without a hard wired button, this is the pin number that will be used
   * Boards that have more than one button can swap the function with this one. defaults to BUTTON_PIN if defined.
   */
  uint32 button_gpio = 2 [(meshtastic.field_metadata) = {
    label: "Button GPIO"
    description: "GPIO pin for the user button, can be remapped on boards with multiple buttons"
  }];

  /*
   * GPIO the PWM buzzer is connected to, used for system tones and, when
   * ALERT_USE_PWM is set, for notification ringtones. 0 is GPIO0, not "unset":
   * buzzer_mode says whether the buzzer sounds. Set to PIN_BUZZER, where the board
   * defines one, when the config is created.
   */
  uint32 buzzer_gpio = 3 [(meshtastic.field_metadata) = {
    label: "Buzzer GPIO"
    description: "GPIO pin for the PWM buzzer"
  }];

  /*
   * Sets the role of node
   */
  RebroadcastMode rebroadcast_mode = 4 [(meshtastic.field_metadata) = {label: "Rebroadcast Mode"}];

  /*
   * Send our nodeinfo this often. 0 for the default of 10800 seconds (3 hours); never more often than every 3600.
   */
  uint32 node_info_broadcast_secs = 5 [(meshtastic.field_metadata) = {
    label: "Node Info Broadcast Interval"
    description: "How often node information is sent. Defaults to 10800 seconds, at least 3600."
    unit: "s"
  }];

  /*
   * Device behaviour toggles: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    DEVICE_NONE = 0x00;
    /* Treat a double tap on a supported accelerometer as a button press */
    DEVICE_DOUBLE_TAP_AS_BUTTON_PRESS = 0x01 [(meshtastic.enum_value_metadata) = {
      label: "Double Tap as Button"
      description: "Treat double tap on supported accelerometers as a user button press."
    }];
    /* Disable the triple-press of the user button that toggles GPS */
    DEVICE_DISABLE_TRIPLE_CLICK = 0x02 [(meshtastic.enum_value_metadata) = {
      label: "Disable Triple Click"
      description: "Disables the user button triple-press shortcut."
    }];
    /* Disable the default blinking LED (LED_PIN) behaviour */
    DEVICE_LED_HEARTBEAT_DISABLED = 0x04 [(meshtastic.enum_value_metadata) = {
      label: "LED Heartbeat"
      description: "Controls the blinking LED on the device.  For most devices this will control one of the up to 4 LEDS, the charger and GPS LEDs are not controllable."
    }];
    /* Turn client auto-mute off: a CLIENT keeps relaying broadcasts however many routers it hears */
    DEVICE_AUTO_MUTE_DISABLED = 0x08 [(meshtastic.enum_value_metadata) = {
      label: "Disable Client Auto-mute"
      description: "Keep relaying broadcasts as a client even when routers already cover the area. For sensor and event deployments."
    }];
    /* ROUTER only: relay in the late rebroadcast window instead of early. Ignored on other roles. */
    DEVICE_RELAY_LATE = 0x10 [(meshtastic.enum_value_metadata) = {
      label: "Relay Late"
      description: "Router: rebroadcast only after other nodes, to fill gaps without taking hops from better-placed routers."
    }];
    /*
     * CLIENT only: relay favourites' traffic like a router (never cancel, late window), count
     * as infrastructure for zero-cost hops, keep favourites on a node-DB reset, never
     * auto-favourite, no auto-mute. Advertised as NODE_FLAG_RELAYS_FAVORITES. Ignored on other roles.
     */
    DEVICE_RELAY_FAVORITES = 0x20 [(meshtastic.enum_value_metadata) = {
      label: "Relay Favorites"
      description: "Client: relay traffic from and to favorite nodes like a router. For a roof or attic node serving your other nodes."
    }];
    /*
     * CLIENT only: no routine broadcasts - node info, position, device telemetry, neighbour
     * info, mesh beacon. Ignored on other roles.
     */
    DEVICE_QUIET = 0x40 [(meshtastic.enum_value_metadata) = {
      label: "Quiet"
      description: "Client: send nothing on a schedule, only answer and send what you ask for."
    }];
    /*
     * TRACKER only: position every 5 minutes with a lost-and-found text, position replies not
     * throttled. Advertised as NODE_FLAG_LOST_AND_FOUND. Ignored on other roles.
     */
    DEVICE_LOST_AND_FOUND = 0x80 [(meshtastic.enum_value_metadata) = {
      label: "Lost and Found"
      description: "Tracker: broadcast your position as a message regularly, to help recover the device."
    }];
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 6;

  /*
   * POSIX Timezone definition string from https://github.com/nayarsystems/posix_tz_db/blob/master/zones.csv.
   */
  string tzdef = 7 [(meshtastic.field_metadata) = {
    label: "Time Zone"
    description: "POSIX timezone definition string"
  }];

  /*
   * Controls buzzer behavior for audio feedback
   * Defaults to ENABLED
   */
  BuzzerMode buzzer_mode = 8 [(meshtastic.field_metadata) = {since_firmware: "2.7.0"}];

  /*
   * Node discovery behaviour: a bitwise OR of DiscoveryFlags values.
   */
  enum DiscoveryFlags {
    /* Nothing set */
    DISCOVERY_NONE = 0x00;
    /*
     * This node serves discovery records: it files what it hears, answers queries and syncs
     * with peer servers. Set on a node with the storage to hold a database, which in practice
     * means the store and forward server hardware.
     */
    DISCOVERY_SERVE = 0x01;
    /*
     * Stay at the announce cadence and full hop budget whatever the mesh looks like. For a
     * test mesh that wants the traffic, and for a node whose operator has a reason.
     */
    DISCOVERY_NO_TAPER = 0x02;
  }

  /*
   * Bitwise OR of DiscoveryFlags values.
   */
  uint32 discovery_flags = 9;

  /*
   * Node count at which announcements taper: at or above it a node lengthens its NodeInfo
   * interval by taper_factor, whether or not it has seen a discovery server. 0 takes the
   * default of 40.
   */
  uint32 discovery_node_threshold = 10;

  /*
   * What the NodeInfo interval is multiplied by once a mesh is dense enough to taper, floored
   * at 30 minutes and capped at 24 hours. 0 takes the default of 4.
   */
  uint32 taper_factor = 11;

  /*
   * Seconds between the full-budget announcements a node keeps making even while discovery
   * servers carry its record, which is what seeds a server that came up after it did. 0 takes
   * the default of 86400.
   */
  uint32 full_announce_secs = 12;

  /*
   * Client auto-mute, CLIENT role only. A client that hears at least auto_mute_router_count
   * ROUTER neighbours directly, at auto_mute_min_snr or better, within
   * auto_mute_window_secs stops relaying broadcasts: those routers already reach everyone it
   * would. Unicast it is asked to carry is relayed as before. It resumes once the condition has
   * not held for a whole window. DEVICE_AUTO_MUTE_DISABLED turns it off.
   *
   * Router neighbours needed to mute. 0 takes the default of 2.
   */
  uint32 auto_mute_router_count = 13 [(meshtastic.field_metadata) = {label: "Auto-mute Router Count"}];

  /*
   * Weakest link, as SNR in dB x 2, at which a router neighbour counts toward
   * auto_mute_router_count. 0 is 0 dB, which is also the default.
   */
  sint32 auto_mute_min_snr = 14 [(meshtastic.field_metadata) = {label: "Auto-mute Minimum SNR"}];

  /*
   * Seconds within which a router neighbour must have been heard to count, and how long the
   * condition must stay false before a muted client relays again. 0 takes the default of 3600.
   */
  uint32 auto_mute_window_secs = 15 [(meshtastic.field_metadata) = {label: "Auto-mute Window"}];
}

/*
 * Position Config
 */
message PositionConfig {
  /*
   * Bit field of boolean configuration options, indicating which optional
   * fields to include when assembling POSITION messages.
   * Longitude, latitude, altitude, speed, heading, and DOP
   * are always included (also time if GPS-synced)
   * NOTE: the more fields are included, the larger the message will be -
   *   leading to longer airtime and a higher risk of packet loss
   */
  enum PositionFlags {
    /*
     * Required for compilation
     */
    UNSET = 0x0000;

    /*
     * Include an altitude value (if available)
     */
    ALTITUDE = 0x0001 [(meshtastic.enum_value_metadata) = {
      label: "Altitude"
      description: "Include an altitude value in position reports, when one is available."
    }];

    /*
     * Include geoidal separation
     */
    GEOIDAL_SEPARATION = 0x0004 [(meshtastic.enum_value_metadata) = {label: "Altitude Geoidal Separation"}];

    /*
     * Include dilution of precision as the GPS chip reports it: PDOP, or HDOP and VDOP
     */
    DOP = 0x0008 [(meshtastic.enum_value_metadata) = {
      label: "DOP"
      description: "Include the dilution of precision value. PDOP is used by default."
    }];

    /*
     * Include number of "satellites in view"
     */
    SATINVIEW = 0x0020 [(meshtastic.enum_value_metadata) = {label: "Number of satellites"}];

    /*
     * Include a sequence number incremented per packet
     */
    SEQ_NO = 0x0040 [(meshtastic.enum_value_metadata) = {label: "Sequence number"}];

    /*
     * Include positional heading
     * Intended for use with vehicle not walking speeds
     * walking speeds are likely to be error prone like the compass
     */
    HEADING = 0x0100 [(meshtastic.enum_value_metadata) = {label: "Vehicle heading"}];

    /*
     * Include positional speed
     * Intended for use with vehicle not walking speeds
     * walking speeds are likely to be error prone like the compass
     */
    SPEED = 0x0200 [(meshtastic.enum_value_metadata) = {label: "Vehicle speed"}];
  }

  enum GpsMode {
    /*
     * GPS is present but disabled
     */
    DISABLED = 0 [(meshtastic.enum_value_metadata) = {label: "Disabled"}];

    /*
     * GPS is present and enabled
     */
    ENABLED = 1 [(meshtastic.enum_value_metadata) = {label: "Enabled"}];

    /*
     * GPS is not present on the device
     */
    NOT_PRESENT = 2 [(meshtastic.enum_value_metadata) = {label: "Not Present"}];
  }

  /*
   * We should send our position this often (but only if it has changed significantly).
   * 0 for the default of 3600 seconds, or 43200 on infrastructure.
   */
  uint32 position_broadcast_secs = 1 [(meshtastic.field_metadata) = {
    label: "Broadcast Interval"
    unit: "s"
    description: "The longest a node will go without broadcasting a position."
  }];

  /*
   * Adaptive position braoadcast, which is now the default.
   */
  bool position_broadcast_smart_enabled = 2 [(meshtastic.field_metadata) = {label: "Smart Position"}];

  /*
   * If set, this node is at a fixed position.
   * We will generate GPS position updates at the regular interval, but use whatever the last lat/lon/alt we have for the node.
   * The lat/lon/alt can be set by an internal GPS or with the help of the app.
   */
  bool fixed_position = 3 [(meshtastic.field_metadata) = {
    label: "Fixed Position"
    description: "The last known latitude, longitude and altitude are broadcast over the mesh on the position interval, rather than a live GPS fix."
  }];

  /*
   * How often should we try to get GPS position (in seconds)
   * or zero for the default of once every 120 seconds (once a day on infrastructure)
   * or a very large value (maxint) to update only once at boot.
   */
  uint32 gps_update_interval_secs = 4 [(meshtastic.field_metadata) = {
    label: "Update Interval"
    unit: "s"
    description: "How often to try to get a GPS position."
  }];

  /*
   * Which optional fields to include when assembling POSITION messages:
   * a bitwise OR of PositionFlags values.
   */
  uint32 position_flags = 5 [(meshtastic.field_metadata) = {
    label: "Position Flags"
    description: "Optional fields to include when assembling position messages"
  }];

  /*
   * (Re)define GPS_RX_PIN for your board.
   */
  uint32 rx_gpio = 6 [(meshtastic.field_metadata) = {
    label: "GPS Receive GPIO"
    description: "GPIO pin for GPS RX"
    diy_only: true
  }];

  /*
   * (Re)define GPS_TX_PIN for your board.
   */
  uint32 tx_gpio = 7 [(meshtastic.field_metadata) = {
    label: "GPS Transmit GPIO"
    description: "GPIO pin for GPS TX"
    diy_only: true
  }];

  /*
   * The minimum distance in meters traveled (since the last send) before we can send a position to the mesh if position_broadcast_smart_enabled
   */
  uint32 broadcast_smart_minimum_distance = 8 [(meshtastic.field_metadata) = {
    label: "Minimum Distance"
    unit: "m"
    description: "The minimum change in distance before a smart position broadcast is considered."
  }];

  /*
   * The minimum number of seconds (since the last send) before we can send a position to the mesh if position_broadcast_smart_enabled
   */
  uint32 broadcast_smart_minimum_interval_secs = 9 [(meshtastic.field_metadata) = {
    label: "Minimum Interval"
    unit: "s"
    description: "The shortest interval between position updates once the minimum distance has been met."
  }];

  /*
   * (Re)define PIN_GPS_EN for your board.
   */
  uint32 gps_en_gpio = 10 [(meshtastic.field_metadata) = {
    label: "GPS EN GPIO"
    description: "GPIO pin for GPS enable"
    diy_only: true
  }];

  /*
   * Set where GPS is enabled, disabled, or not present
   */
  GpsMode gps_mode = 11 [(meshtastic.field_metadata) = {label: "GPS Mode"}];
}

/*
 * Power Config\
 * See [Power Config](/docs/settings/config/power) for additional power config details.
 */
message PowerConfig {
  /*
   * Description: Will sleep everything as much as possible, for the tracker and sensor role this will also include the lora radio.
   * Don't use this setting if you want to use your device with the phone apps or are using a device without a user button.
   * Technical Details: Works for ESP32 devices and NRF52 devices in the Sensor or Tracker roles
   */
  bool is_power_saving = 1 [(meshtastic.field_metadata) = {
    label: "Power Saving"
    description: "Will sleep everything as much as possible, for the tracker and sensor role this will also include the lora radio. Don't use this setting if you want to use your device with the phone apps or are using a device without a user button."
  }];

  /*
   *  Description: If non-zero, the device will fully power off this many seconds after external power is removed.
   */
  uint32 on_battery_shutdown_after_secs = 2 [(meshtastic.field_metadata) = {
    label: "Shutdown on Power Loss"
    description: "How long after external power is removed before the device powers off. Zero to disable."
    unit: "s"
  }];

  /*
   * Ratio of voltage divider for battery pin eg. 3.20 (stored as 320, value x100)
   * Overrides the ADC_MULTIPLIER defined in variant for battery voltage calculation.
   * https://meshtastic.org/docs/configuration/radio/power/#adc-multiplier-override
   * Should be set to integer value between 200 and 600 (representing 2.00 to 6.00)
   */
  uint32 adc_multiplier_override = 3 [(meshtastic.field_metadata) = {label: "ADC Override"}];

  /*
   *  Description: The number of seconds for to wait before turning off BLE in No Bluetooth states
   *  Technical Details: ESP32 Only 0 for default of 1 minute
   */
  uint32 wait_bluetooth_secs = 4 [(meshtastic.field_metadata) = {label: "Wait for Bluetooth Duration"}];

  /*
   * Super Deep Sleep Seconds
   * While in Light Sleep if mesh_sds_timeout_secs is exceeded we will lower into super deep sleep
   * for this value or until a button press. 0 for the default: until a button press (one day on
   * infrastructure). One sleep lasts at most about 24.8 days.
   */
  uint32 sds_secs = 5;

  /*
   * Description: In light sleep the CPU is suspended, LoRa radio is on, BLE is off an GPS is on
   * Technical Details: ESP32 Only 0 for default of 300 (one day on infrastructure)
   */
  uint32 ls_secs = 6;

  /*
   * Description: While in light sleep when we receive packets on the LoRa radio we will wake and handle them and stay awake in no BLE mode for this value
   * Technical Details: ESP32 Only 0 for default of 10 seconds
   */
  uint32 min_wake_secs = 7;

  /*
   * I2C address of INA_2XX to use for reading device battery voltage
   */
  uint32 device_battery_ina_address = 8;

  /*
   * If non-zero, we want powermon log outputs, with the particular sources enabled:
   * a bitwise OR of PowerMon.State values (powermon.proto).
   * Note: we picked an ID of 32 so that lower more efficient IDs can be used for more frequently used options.
   */
  uint64 powermon_enables = 9;
}

/*
 * Network Config
 */
message NetworkConfig {
  enum AddressMode {
    /*
     * obtain ip address via DHCP
     */
    DHCP = 0 [(meshtastic.enum_value_metadata) = {label: "DHCP"}];

    /*
     * use static ip address
     */
    STATIC = 1 [(meshtastic.enum_value_metadata) = {label: "Static"}];
  }

  message IpV4Config {
    /*
     * Static IP address
     */
    fixed32 ip = 1 [(meshtastic.field_metadata) = {label: "IP"}];

    /*
     * Static gateway address
     */
    fixed32 gateway = 2 [(meshtastic.field_metadata) = {label: "Gateway"}];

    /*
     * Static subnet mask
     */
    fixed32 subnet = 3 [(meshtastic.field_metadata) = {label: "Subnet"}];

    /*
     * Static DNS server address
     */
    fixed32 dns = 4 [(meshtastic.field_metadata) = {label: "DNS"}];
  }

  /*
   * Network interface toggles: a bitwise OR of Flags values.
   * Distinct from enabled_protocols, which selects mesh transport protocols.
   */
  enum Flags {
    /* Nothing enabled */
    NETWORK_NONE = 0x00;
    /* Enable WiFi, which disables Bluetooth */
    NETWORK_WIFI = 0x01 [(meshtastic.enum_value_metadata) = {
      label: "WiFi Enabled"
      description: "Enabling WiFi will disable the bluetooth connection to the app."
    }];
    /* Enable Ethernet */
    NETWORK_ETH = 0x02 [(meshtastic.enum_value_metadata) = {
      label: "Ethernet Enabled"
      description: "Enabling Ethernet will disable the bluetooth connection to the app."
    }];
    /* Enable IPv6 support */
    NETWORK_IPV6 = 0x04 [(meshtastic.enum_value_metadata) = {since_firmware: "2.7.16"}];
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * If set, this node will try to join the specified wifi network, taking its
   * address as address_mode says
   */
  string wifi_ssid = 2 [(meshtastic.field_metadata) = {
    label: "SSID"
    description: "WiFi network name to connect to"
  }];

  /*
   * If set, used to authenticate to the named wifi
   */
  string wifi_psk = 3 [(meshtastic.field_metadata) = {
    label: "Password"
    description: "WiFi password for authentication"
  }];

  /*
   * NTP server to use if WiFi is connected, defaults to `meshtastic.pool.ntp.org`
   */
  string ntp_server = 4 [(meshtastic.field_metadata) = {
    label: "NTP Server"
    description: "NTP server address. Defaults to meshtastic.pool.ntp.org"
  }];

  /*
   * acquire an address via DHCP or assign static
   */
  AddressMode address_mode = 5 [(meshtastic.field_metadata) = {label: "Address Mode"}];

  /*
   * struct to keep static address
   */
  IpV4Config ipv4_config = 6;

  /*
   * rsyslog Server and Port
   */
  string rsyslog_server = 7 [(meshtastic.field_metadata) = {label: "Rsyslog Server"}];

  /*
   * Auxiliary network protocols enabled: a bitwise OR of ProtocolFlags values.
   */
  uint32 enabled_protocols = 8 [(meshtastic.field_metadata) = {
    label: "Enabled Protocols"
    description: "Enable broadcasting packets via UDP over the local network."
    since_firmware: "2.6.0"
  }];

  /*
   * Auxiliary network protocols, as flags for enabled_protocols
   */
  enum ProtocolFlags {
    /*
     * Do not broadcast packets over any network protocol
     */
    NO_BROADCAST = 0x0000 [(meshtastic.enum_value_metadata) = {label: "None"}];

    /*
     * Enable broadcasting packets via UDP over the local network
     */
    UDP_BROADCAST = 0x0001 [(meshtastic.enum_value_metadata) = {label: "UDP Broadcast"}];
  }
}

/*
 * Display Config
 */
message DisplayConfig {
  /*
   * Override OLED outo detect with this if it fails.
   */
  enum OledType {
    /*
     * Default / Autodetect
     */
    OLED_AUTO = 0 [(meshtastic.enum_value_metadata) = {label: "Detect Automatically"}];

    /*
     * Default / Autodetect
     */
    OLED_SSD1306 = 1 [(meshtastic.enum_value_metadata) = {label: "SSD 1306"}];

    /*
     * Default / Autodetect
     */
    OLED_SH1106 = 2 [(meshtastic.enum_value_metadata) = {label: "SH 1106"}];

    /*
     * Can not be auto detected but set by proto. Used for 128x64 screens
     */
    OLED_SH1107 = 3 [(meshtastic.enum_value_metadata) = {label: "SH 1107"}];

    /*
     * Can not be auto detected but set by proto. Used for 128x128 screens
     */
    OLED_SH1107_128_128 = 4 [(meshtastic.enum_value_metadata) = {label: "SH 1107 128x128"}];

    /*
     * Can not be auto detected but set by proto. Used for 64x128 rotated screens
     */
    OLED_SH1107_ROTATED = 5 [(meshtastic.enum_value_metadata) = {label: "SH 1107 Rotated"}];
  }

  /*
   * Number of seconds the screen stays on after pressing the user button or receiving a message
   * 0 for the default of 600 seconds, MAXUINT for always on
   */
  uint32 screen_on_secs = 1 [(meshtastic.field_metadata) = {
    label: "Screen on for"
    unit: "s"
    description: "How long the screen remains on after the user button is pressed or messages are received."
  }];

  /*
   * Automatically toggles to the next page on the screen like a carousel, based the specified interval in seconds.
   * Potentially useful for devices without user buttons.
   */
  uint32 auto_screen_carousel_secs = 2 [(meshtastic.field_metadata) = {
    label: "Carousel Interval"
    unit: "s"
    description: "Automatically moves to the next screen page, like a carousel, on this interval."
  }];

  /*
