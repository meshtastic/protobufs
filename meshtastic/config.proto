syntax = "proto3";

package meshtastic;

import "meshtastic/common.proto";

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "ConfigProtos";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";

/*
 * Configuration
 */
message DeviceConfig {
  /*
   * Defines the device's behavior for how messages are rebroadcast
   */
  enum RebroadcastMode {
    /*
     * Default behavior.
     * Rebroadcast any observed message, if it was on our private channel or from another mesh with the same lora params.
     */
    ALL = 0;

    /*
     * Same as behavior as ALL but skips packet decoding and simply rebroadcasts them.
     * Only available in Repeater role. Setting this on any other roles will result in ALL behavior.
     */
    ALL_SKIP_DECODING = 1;

    /*
     * Ignores observed messages from foreign meshes that are open or those which it cannot decrypt.
     * Only rebroadcasts message on the nodes local primary / secondary channels.
     */
    LOCAL_ONLY = 2;

    /*
     * Ignores observed messages from foreign meshes like LOCAL_ONLY,
     * but takes it step further by also ignoring messages from nodenums not in the node's known list (NodeDB)
     */
    KNOWN_ONLY = 3;

    /*
     * Only permitted for SENSOR, TRACKER and TAK_TRACKER roles, this will inhibit all rebroadcasts, not unlike CLIENT_MUTE role.
     */
    NONE = 4;

    /*
     * Ignores packets from non-standard portnums such as: TAK, RangeTest, PaxCounter, etc.
     * Only rebroadcasts packets with standard portnums: NodeInfo, Text, Position, Telemetry, and Routing.
     */
    CORE_PORTNUMS_ONLY = 5;
  }

  /*
   * Defines buzzer behavior for audio feedback
   */
  enum BuzzerMode {
    /*
     * Default behavior.
     * Buzzer is enabled for all audio feedback including button presses and alerts.
     */
    ALL_ENABLED = 0;

    /*
     * Disabled.
     * All buzzer audio feedback is disabled.
     */
    DISABLED = 1;

    /*
     * Notifications Only.
     * Buzzer is enabled only for notifications and alerts, but not for button presses.
     * External notification config determines the specifics of the notification behavior.
     */
    NOTIFICATIONS_ONLY = 2;

    /*
     * Non-notification system buzzer tones only.
     * Buzzer is enabled only for non-notification tones such as button presses, startup, shutdown, but not for alerts.
     */
    SYSTEM_ONLY = 3;

    /*
     * Direct Message notifications only.
     * Buzzer is enabled only for direct messages and alerts, but not for button presses.
     * External notification config determines the specifics of the notification behavior.
     */
    DIRECT_MSG_ONLY = 4;
  }

  /*
   * Sets the role of node
   */
  Role role = 1;

  /*
   * For boards without a hard wired button, this is the pin number that will be used
   * Boards that have more than one button can swap the function with this one. defaults to BUTTON_PIN if defined.
   */
  uint32 button_gpio = 2;

  /*
   * For boards without a PWM buzzer, this is the pin number that will be used
   * Defaults to PIN_BUZZER if defined.
   */
  uint32 buzzer_gpio = 3;

  /*
   * Sets the role of node
   */
  RebroadcastMode rebroadcast_mode = 4;

  /*
   * Send our nodeinfo this often
   * Defaults to 900 Seconds (15 minutes)
   */
  uint32 node_info_broadcast_secs = 5;

  /*
   * Device behaviour toggles: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    DEVICE_NONE = 0x00;
    /* Treat a double tap on a supported accelerometer as a button press */
    DEVICE_DOUBLE_TAP_AS_BUTTON_PRESS = 0x01;
    /* Disable the triple-press of the user button that toggles GPS */
    DEVICE_DISABLE_TRIPLE_CLICK = 0x02;
    /* Disable the default blinking LED (LED_PIN) behaviour */
    DEVICE_LED_HEARTBEAT_DISABLED = 0x04;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 6;

  /*
   * POSIX Timezone definition string from https://github.com/nayarsystems/posix_tz_db/blob/master/zones.csv.
   */
  string tzdef = 7;

  /*
   * Controls buzzer behavior for audio feedback
   * Defaults to ENABLED
   */
  BuzzerMode buzzer_mode = 8;
}

/*
 * Position Config
 */
message PositionConfig {
  /*
   * Bit field of boolean configuration options, indicating which optional
   * fields to include when assembling POSITION messages.
   * Longitude, latitude, altitude, speed, heading, and DOP
   * are always included (also time if GPS-synced)
   * NOTE: the more fields are included, the larger the message will be -
   *   leading to longer airtime and a higher risk of packet loss
   */
  enum PositionFlags {
    /*
     * Required for compilation
     */
    UNSET = 0x0000;

    /*
     * Include an altitude value (if available)
     */
    ALTITUDE = 0x0001;

    /*
     * Altitude value is MSL
     */
    ALTITUDE_MSL = 0x0002;

    /*
     * Include geoidal separation
     */
    GEOIDAL_SEPARATION = 0x0004;

    /*
     * Include the DOP value ; PDOP used by default, see below
     */
    DOP = 0x0008;

    /*
     * If POS_DOP set, send separate HDOP / VDOP values instead of PDOP
     */
    HVDOP = 0x0010;

    /*
     * Include number of "satellites in view"
     */
    SATINVIEW = 0x0020;

    /*
     * Include a sequence number incremented per packet
     */
    SEQ_NO = 0x0040;

    /*
     * Include positional timestamp (from GPS solution)
     */
    TIMESTAMP = 0x0080;

    /*
     * Include positional heading
     * Intended for use with vehicle not walking speeds
     * walking speeds are likely to be error prone like the compass
     */
    HEADING = 0x0100;

    /*
     * Include positional speed
     * Intended for use with vehicle not walking speeds
     * walking speeds are likely to be error prone like the compass
     */
    SPEED = 0x0200;
  }

  enum GpsMode {
    /*
     * GPS is present but disabled
     */
    DISABLED = 0;

    /*
     * GPS is present and enabled
     */
    ENABLED = 1;

    /*
     * GPS is not present on the device
     */
    NOT_PRESENT = 2;
  }

  /*
   * We should send our position this often (but only if it has changed significantly)
   * Defaults to 15 minutes
   */
  uint32 position_broadcast_secs = 1;

  /*
   * Adaptive position braoadcast, which is now the default.
   */
  bool position_broadcast_smart_enabled = 2;

  /*
   * If set, this node is at a fixed position.
   * We will generate GPS position updates at the regular interval, but use whatever the last lat/lon/alt we have for the node.
   * The lat/lon/alt can be set by an internal GPS or with the help of the app.
   */
  bool fixed_position = 3;

  /*
   * How often should we try to get GPS position (in seconds)
   * or zero for the default of once every 30 seconds
   * or a very large value (maxint) to update only once at boot.
   */
  uint32 gps_update_interval = 4;

  /*
   * Which optional fields to include when assembling POSITION messages:
   * a bitwise OR of PositionFlags values.
   */
  uint32 position_flags = 5;

  /*
   * (Re)define GPS_RX_PIN for your board.
   */
  uint32 rx_gpio = 6;

  /*
   * (Re)define GPS_TX_PIN for your board.
   */
  uint32 tx_gpio = 7;

  /*
   * The minimum distance in meters traveled (since the last send) before we can send a position to the mesh if position_broadcast_smart_enabled
   */
  uint32 broadcast_smart_minimum_distance = 8;

  /*
   * The minimum number of seconds (since the last send) before we can send a position to the mesh if position_broadcast_smart_enabled
   */
  uint32 broadcast_smart_minimum_interval_secs = 9;

  /*
   * (Re)define PIN_GPS_EN for your board.
   */
  uint32 gps_en_gpio = 10;

  /*
   * Set where GPS is enabled, disabled, or not present
   */
  GpsMode gps_mode = 11;
}

/*
 * Power Config\
 * See [Power Config](/docs/settings/config/power) for additional power config details.
 */
message PowerConfig {
  /*
   * Description: Will sleep everything as much as possible, for the tracker and sensor role this will also include the lora radio.
   * Don't use this setting if you want to use your device with the phone apps or are using a device without a user button.
   * Technical Details: Works for ESP32 devices and NRF52 devices in the Sensor or Tracker roles
   */
  bool is_power_saving = 1;

  /*
   *  Description: If non-zero, the device will fully power off this many seconds after external power is removed.
   */
  uint32 on_battery_shutdown_after_secs = 2;

  /*
   * Ratio of voltage divider for battery pin eg. 3.20 (stored as 320, value x100)
   * Overrides the ADC_MULTIPLIER defined in variant for battery voltage calculation.
   * https://meshtastic.org/docs/configuration/radio/power/#adc-multiplier-override
   * Should be set to integer value between 200 and 600 (representing 2.00 to 6.00)
   */
  uint32 adc_multiplier_override = 3;

  /*
   *  Description: The number of seconds for to wait before turning off BLE in No Bluetooth states
   *  Technical Details: ESP32 Only 0 for default of 1 minute
   */
  uint32 wait_bluetooth_secs = 4;

  /*
   * Super Deep Sleep Seconds
   * While in Light Sleep if mesh_sds_timeout_secs is exceeded we will lower into super deep sleep
   * for this value (default 1 year) or a button press
   * 0 for default of one year
   */
  uint32 sds_secs = 5;

  /*
   * Description: In light sleep the CPU is suspended, LoRa radio is on, BLE is off an GPS is on
   * Technical Details: ESP32 Only 0 for default of 300
   */
  uint32 ls_secs = 6;

  /*
   * Description: While in light sleep when we receive packets on the LoRa radio we will wake and handle them and stay awake in no BLE mode for this value
   * Technical Details: ESP32 Only 0 for default of 10 seconds
   */
  uint32 min_wake_secs = 7;

  /*
   * I2C address of INA_2XX to use for reading device battery voltage
   */
  uint32 device_battery_ina_address = 8;

  /*
   * If non-zero, we want powermon log outputs, with the particular sources enabled:
   * a bitwise OR of PowerMon.State values (powermon.proto).
   * Note: we picked an ID of 32 so that lower more efficient IDs can be used for more frequently used options.
   */
  uint64 powermon_enables = 9;
}

/*
 * Network Config
 */
message NetworkConfig {
  enum AddressMode {
    /*
     * obtain ip address via DHCP
     */
    DHCP = 0;

    /*
     * use static ip address
     */
    STATIC = 1;
  }

  message IpV4Config {
    /*
     * Static IP address
     */
    fixed32 ip = 1;

    /*
     * Static gateway address
     */
    fixed32 gateway = 2;

    /*
     * Static subnet mask
     */
    fixed32 subnet = 3;

    /*
     * Static DNS server address
     */
    fixed32 dns = 4;
  }

  /*
   * Network interface toggles: a bitwise OR of Flags values.
   * Distinct from enabled_protocols, which selects mesh transport protocols.
   */
  enum Flags {
    /* Nothing enabled */
    NETWORK_NONE = 0x00;
    /* Enable WiFi, which disables Bluetooth */
    NETWORK_WIFI = 0x01;
    /* Enable Ethernet */
    NETWORK_ETH = 0x02;
    /* Enable IPv6 support */
    NETWORK_IPV6 = 0x04;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * If set, this node will try to join the specified wifi network and
   * acquire an address via DHCP
   */
  string wifi_ssid = 2;

  /*
   * If set, will be use to authenticate to the named wifi
   */
  string wifi_psk = 3;

  /*
   * NTP server to use if WiFi is conneced, defaults to `meshtastic.pool.ntp.org`
   */
  string ntp_server = 4;

  /*
   * acquire an address via DHCP or assign static
   */
  AddressMode address_mode = 5;

  /*
   * struct to keep static address
   */
  IpV4Config ipv4_config = 6;

  /*
   * rsyslog Server and Port
   */
  string rsyslog_server = 7;

  /*
   * Flags for enabling/disabling network protocols
   */
  uint32 enabled_protocols = 8;

  /*
   * Available flags auxiliary network protocols
   */
  enum ProtocolFlags {
    /*
     * Do not broadcast packets over any network protocol
     */
    NO_BROADCAST = 0x0000;

    /*
     * Enable broadcasting packets via UDP over the local network
     */
    UDP_BROADCAST = 0x0001;
  }
}

/*
 * Display Config
 */
message DisplayConfig {
  /*
   * Unit display preference
   */
  enum DisplayUnits {
    /*
     * Metric (Default)
     */
    METRIC = 0;

    /*
     * Imperial
     */
    IMPERIAL = 1;
  }

  /*
   * Override OLED outo detect with this if it fails.
   */
  enum OledType {
    /*
     * Default / Autodetect
     */
    OLED_AUTO = 0;

    /*
     * Default / Autodetect
     */
    OLED_SSD1306 = 1;

    /*
     * Default / Autodetect
     */
    OLED_SH1106 = 2;

    /*
     * Can not be auto detected but set by proto. Used for 128x64 screens
     */
    OLED_SH1107 = 3;

    /*
     * Can not be auto detected but set by proto. Used for 128x128 screens
     */
    OLED_SH1107_128_128 = 4;

    /*
     * Can not be auto detected but set by proto. Used for 64x128 rotated screens
     */
    OLED_SH1107_ROTATED = 5;
  }

  /*
   * Number of seconds the screen stays on after pressing the user button or receiving a message
   * 0 for default of one minute MAXUINT for always on
   */
  uint32 screen_on_secs = 1;

  /*
   * Automatically toggles to the next page on the screen like a carousel, based the specified interval in seconds.
   * Potentially useful for devices without user buttons.
   */
  uint32 auto_screen_carousel_secs = 2;

  /*
   * Display toggles: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    DISPLAY_NONE = 0x00;
    /* Flip the screen vertically, for mountings that invert it */
    DISPLAY_FLIP_SCREEN = 0x01;
    /* Print the first line in pseudo-bold rather than the original style */
    DISPLAY_HEADING_BOLD = 0x02;
    /* Wake the screen on accelerometer-detected motion or tap */
    DISPLAY_WAKE_ON_TAP_OR_MOTION = 0x04;
    /* Show the time in 12-hour format rather than 24-hour */
    DISPLAY_USE_12H_CLOCK = 0x08;
    /* Show node names in long format rather than short */
    DISPLAY_USE_LONG_NODE_NAME = 0x10;
    /* Draw message bubbles on screen */
    DISPLAY_ENABLE_MESSAGE_BUBBLES = 0x20;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 3;

  /*
   * Perferred display units
   */
  DisplayUnits units = 4;

  /*
   * Override auto-detect in screen
   */
  OledType oled = 5;

  enum DisplayMode {
    /*
     * Default. The old style for the 128x64 OLED screen
     */
    DEFAULT = 0;

    /*
     * Rearrange display elements to cater for bicolor OLED displays
     */
    TWOCOLOR = 1;

    /*
     * Same as TwoColor, but with inverted top bar. Not so good for Epaper displays
     */
    INVERTED = 2;

    /*
     * TFT Full Color Displays (not implemented yet)
     */
    COLOR = 3;
  }
  /*
   * Display Mode
   */
  DisplayMode displaymode = 6;

  enum CompassOrientation {
    /*
     * The compass and the display are in the same orientation.
     */
    DEGREES_0 = 0;

    /*
     * Rotate the compass by 90 degrees.
     */
    DEGREES_90 = 1;

    /*
     * Rotate the compass by 180 degrees.
     */
    DEGREES_180 = 2;

    /*
     * Rotate the compass by 270 degrees.
     */
    DEGREES_270 = 3;

    /*
     * Don't rotate the compass, but invert the result.
     */
    DEGREES_0_INVERTED = 4;

    /*
     * Rotate the compass by 90 degrees and invert.
     */
    DEGREES_90_INVERTED = 5;

    /*
     * Rotate the compass by 180 degrees and invert.
     */
    DEGREES_180_INVERTED = 6;

    /*
     * Rotate the compass by 270 degrees and invert.
     */
    DEGREES_270_INVERTED = 7;
  }

  /*
   * Indicates how to rotate or invert the compass output to accurate display on the display.
   */
  CompassOrientation compass_orientation = 7;
}

/*
 * Lora Config
 */
message LoRaConfig {
  /*
   * Whether a front-end module / low-noise amplifier is fitted and in use
   */
  enum FEM_LNA_Mode {
    /*
     * FEM_LNA is present but disabled
     */
    DISABLED = 0;

    /*
     * FEM_LNA is present and enabled
     */
    ENABLED = 1;

    /*
     * FEM_LNA is not present on the device
     */
    NOT_PRESENT = 2;
  }

  /*
   * LoRa radio toggles: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    LORA_NONE = 0x00;
    /*
     * Adhere to the modem_preset field. When clear, bandwidth, spread_factor and
     * coding_rate are taken from their manually defined fields instead.
     */
    LORA_USE_PRESET = 0x01;
    /*
     * Allow the LoRa radio to transmit. Clearing this disables TX, which is useful
     * for hot-swapping antennas and other tests.
     */
    LORA_TX_ENABLED = 0x02;
    /*
     * Exceed duty cycle limits. You are then possibly not following local
     * regulations unless you are a HAM. No effect where the region duty cycle is 100%.
     */
    LORA_OVERRIDE_DUTY_CYCLE = 0x04;
    /* Set RX boosted gain mode on SX126X-based radios */
    LORA_SX126X_RX_BOOSTED_GAIN = 0x08;
    /* Disable the built-in PA fan driven by the pin defined in RF95_FAN_EN */
    LORA_PA_FAN_DISABLED = 0x10;
    /*
     * Drop packets received over LoRa that passed via MQTT anywhere on the path
     * towards this node.
     */
    LORA_IGNORE_MQTT = 0x20;
    /* Set the ok_to_mqtt bit on outgoing packets */
    LORA_CONFIG_OK_TO_MQTT = 0x40;
    /*
     * Do not use radiolib to initialize the radio; listen for a serialHal
     * connection instead.
     */
    LORA_SERIAL_HAL_ONLY = 0x80;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 1;

  /*
   * Either modem_config or bandwidth/spreading/coding will be specified - NOT BOTH.
   * As a heuristic: If bandwidth is specified, do not use modem_config.
   * Because protobufs take ZERO space when the value is zero this works out nicely.
   * This value is replaced by bandwidth/spread_factor/coding_rate.
   * If you'd like to experiment with other options add them to MeshRadio.cpp in the device code.
   */
  ModemPreset modem_preset = 2;

  /*
   * Bandwidth in MHz
   * Certain bandwidth numbers are 'special' and will be converted to the
   * appropriate floating point value: 31 -> 31.25MHz
   */
  uint32 bandwidth = 3;

  /*
   * A number from 7 to 12.
   * Indicates number of chirps per symbol as 1<<spread_factor.
   */
  uint32 spread_factor = 4;

  /*
   * The denominator of the coding rate.
   * ie for 4/5, the value is 5. 4/8 the value is 8.
   */
  uint32 coding_rate = 5;

  /*
   * This parameter is for advanced users with advanced test equipment, we do not recommend most users use it.
   * A frequency offset that is added to to the calculated band center frequency.
   * Used to correct for crystal calibration errors.
   * Units are in Hz.
   */
  sint32 frequency_offset = 6;

  /*
   * The region code for the radio (US, CN, EU433, etc...)
   */
  RegionCode region = 7;

  /*
   * Maximum number of hops. This can't be greater than 7.
   * Default of 3
   * Attempting to set a value > 7 results in the default
   */
  uint32 hop_limit = 8;

  /*
   * If zero, then use default max legal continuous power (ie. something that won't
   * burn out the radio hardware)
   * In most cases you should use zero here.
   * Units are in dBm.
   */
  sint32 tx_power = 9;

  /*
   * This controls the actual hardware frequency the radio transmits on.
   * Most users should never need to be exposed to this field/concept.
   * A channel number between 1 and NUM_CHANNELS (whatever the max is in the current region).
   * If ZERO then the rule is "use the old channel name hash based
   * algorithm to derive the channel number")
   * If using the hash algorithm the channel number will be: hash(channel_name) %
   * NUM_CHANNELS (Where num channels depends on the regulatory region).
   */
  uint32 channel_num = 10;

  /*
   * This parameter is for advanced users and licensed HAM radio operators.
   * Ignore Channel Calculation and use this frequency instead. The frequency_offset
   * will still be applied. This will allow you to use out-of-band frequencies.
   * Please respect your local laws and regulations. If you are a HAM, make sure you
   * enable HAM mode and turn off encryption.
   * Units are in Hz.
   */
  uint32 override_frequency = 11;

  /*
   * For testing it is useful sometimes to force a node to never listen to
   * particular other nodes (simulating radio out of range). All nodenums listed
   * in ignore_incoming will have packets they send dropped on receive (by router.cpp)
   */
  repeated uint32 ignore_incoming = 12;

  /*
   * Set where LORA FEM is enabled, disabled, or not present
   */
  FEM_LNA_Mode fem_lna_mode = 13;
}

message BluetoothConfig {
  enum PairingMode {
    /*
     * Device generates a random PIN that will be shown on the screen of the device for pairing
     */
    RANDOM_PIN = 0;

    /*
     * Device requires a specified fixed PIN for pairing
     */
    FIXED_PIN = 1;

    /*
     * Device requires no PIN for pairing
     */
    NO_PIN = 2;
  }

  /*
   * Enable Bluetooth on the device
   */
  bool enabled = 1;

  /*
   * Determines the pairing strategy for the device
   */
  PairingMode mode = 2;

  /*
   * Specified PIN for PairingMode.FixedPin
   */
  uint32 fixed_pin = 3;
}

message SecurityConfig {
  /*
   * Controls how the device authenticates remotely received mesh packets.
   */
  enum PacketSignaturePolicy {
    /*
     * Accept unsigned packets for maximum compatibility while still rejecting malformed or invalid signatures.
     * This is the default to avoid legacy nodes dropping signed packets during rebroadcast.
     */
    PACKET_SIGNATURE_POLICY_COMPATIBLE = 0;

    /*
     * Prefer authenticated packets while retaining compatibility with unsigned packets from nodes not known to sign.
     * Rejects unsigned, signable broadcasts from nodes that have previously signed.
     */
    PACKET_SIGNATURE_POLICY_BALANCED = 1;

    /*
     * Accept only packets authenticated by a verified XEdDSA signature or successful PKI decryption.
     * Unsigned, malformed, invalid, or unverifiable packets are ignored.
     */
    PACKET_SIGNATURE_POLICY_STRICT = 2;
  }

  /*
   * The public key of the user's device.
   * Sent out to other nodes on the mesh to allow them to compute a shared secret key.
   */
  bytes public_key = 1;

  /*
   * The private key of the device.
   * Used to create a shared key with a remote device.
   */
  bytes private_key = 2;

  /*
   * The public key authorized to send admin messages to this node.
   */
  repeated bytes admin_key = 3;

  /*
   * Security toggles: a bitwise OR of Flags values.
   */
  enum Flags {
    /* Nothing enabled */
    SECURITY_NONE = 0x00;
    /* The device is managed by a mesh administrator via admin messages */
    SECURITY_IS_MANAGED = 0x01;
    /* Serial console over the Stream API */
    SECURITY_SERIAL_ENABLED = 0x02;
    /*
     * Keep live debug logging on over serial or bluetooth. By default logging stops
     * as soon as an API client connects, to keep a shared serial link quiet.
     */
    SECURITY_DEBUG_LOG_API_ENABLED = 0x04;
    /* Allow incoming device control over the insecure legacy admin channel */
    SECURITY_ADMIN_CHANNEL_ENABLED = 0x08;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 4;

  /*
   * Determines the packet signature policy applied to remotely received mesh packets.
   */
  PacketSignaturePolicy packet_signature_policy = 5;
}

/*
 * Blank config request, strictly for getting the session key
 */
message SessionkeyConfig {}

/*
 * Payload Variant for admin transport
 */
message ConfigPayload {
  oneof payload_variant {
    DeviceConfig device = 1;
    PositionConfig position = 2;
    PowerConfig power = 3;
    NetworkConfig network = 4;
    DisplayConfig display = 5;
    LoRaConfig lora = 6;
    BluetoothConfig bluetooth = 7;
    SecurityConfig security = 8;
    SessionkeyConfig sessionkey = 9;
  }
}
