syntax = "proto3";

package meshtastic;

import "meshtastic/wire.proto";

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "PacketProtos";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";

/*
 * A packet as a node holds it: the decoded form of a v3 BCAST or UCAST frame
 * (SCHEMA.md §8), and what the phone API and MQTT exchange.
 *
 * MeshPacket is never encoded onto the radio link. Its header fields unroll the v3
 * header, `encrypted` is the frame's ciphertext and `decoded` its plaintext, and the
 * remaining fields are local to the node holding the packet.
 *
 *   v3 header         MeshPacket
 *   ctrl.hop_limit    hop_limit
 *   flags.hop_start   hop_start
 *   flags.ack         flags PACKET_WANT_ACK
 *   flags.mqtt        flags PACKET_VIA_MQTT
 *   flags.opt         header_options is non-empty
 *   flags.path        flags PACKET_RECORD_PATH
 *   from, id          from, id
 *   to                to, all ones on BCAST, which carries no `to`
 *   chan              channel_hash, BCAST only
 *   relay             relay_node
 *   next_hop          next_hop, UCAST only
 *   options block     header_options
 *   path tail         path
 *
 * The header's version bit and profile follow from the frame being v3 and from `to`.
 * MINI and EXT frames have no MeshPacket form.
 */
message MeshPacket {
  /*
   * The priority of this message for sending.
   * Higher priorities are sent first (when managing the transmit queue).
   * This field is never sent over the air, it is only used internally inside of a local device node.
   * API clients (either on the local node or connected directly to the node)
   * can set this parameter if necessary.
   * (values must be <= 127 to keep protobuf field to one byte in size.
   * Detailed background on this field:
   * I noticed a funny side effect of lora being so slow: Usually when making
   * a protocol there isn't much need to use message priority to change the order
   * of transmission (because interfaces are fairly fast).
   * But for lora where packets can take a few seconds each, it is very important
   * to make sure that critical packets are sent ASAP.
   * In the case of meshtastic that means we want to send protocol acks as soon as possible
   * (to prevent unneeded retransmissions), we want routing messages to be sent next,
   * then messages marked as reliable and finally 'background' packets like periodic position updates.
   * So I bit the bullet and implemented a new (internal - not sent over the air)
   * field in MeshPacket called 'priority'.
   * And the transmission queue in the router object is now a priority queue.
   *
   * Priority that follows from the packet is the node's to derive, not a client's to
   * restate. Whatever priority a packet arrives with, the node sets ACK for a routing
   * packet, ALERT for an ALERT_APP packet, RESPONSE for a packet with request_id, and
   * RELIABLE for want_ack or want_response. For a packet that arrives UNSET and matches
   * none of those it sets HIGH for text and admin, and DEFAULT otherwise. A client sets
   * priority only to place a packet its contents do not describe: MIN, BACKGROUND,
   * DEFAULT, HIGH or MAX.
   */
  enum Priority {
    /*
     * Treated as Priority.DEFAULT
     */
    UNSET = 0;

    /*
     * Minimum priority
     */
    MIN = 1;

    /*
     * Background position updates are sent with very low priority -
     * if the link is super congested they might not go out at all
     */
    BACKGROUND = 10;

    /*
     * This priority is used for most messages that don't have a priority set
     */
    DEFAULT = 64;

    /*
     * If priority is unset but the message is marked as want_ack,
     * assume it is important and use a slightly higher priority
     */
    RELIABLE = 70;

    /*
     * If priority is unset but the packet is a response to a request, we want it to get there relatively quickly.
     * Furthermore, responses stop relaying packets directed to a node early.
     */
    RESPONSE = 80;

    /*
     * Higher priority for specific message types (portnums) to distinguish between other reliable packets.
     */
    HIGH = 100;

    /*
     * Higher priority alert message used for critical alerts which take priority over other reliable packets.
     */
    ALERT = 110;

    /*
     * Ack/naks are sent with very high priority to ensure that retransmission
     * stops as soon as possible
     */
    ACK = 120;

    /*
     * Maximum priority
     */
    MAX = 127;
  }

  /*
   * Enum to identify which transport mechanism this packet arrived over
   */
  enum TransportMechanism {
    /*
     * The default case is that the node generated a packet itself
     */
    TRANSPORT_INTERNAL = 0;

    /*
     * Arrived via the primary LoRa radio
     */
    TRANSPORT_LORA = 1;

    /*
     * Arrived via a secondary LoRa radio
     */
    TRANSPORT_LORA_ALT1 = 2;

    /*
     * Arrived via a tertiary LoRa radio
     */
    TRANSPORT_LORA_ALT2 = 3;

    /*
     * Arrived via a quaternary LoRa radio
     */
    TRANSPORT_LORA_ALT3 = 4;

    /*
     * Arrived via an MQTT connection
     */
    TRANSPORT_MQTT = 5;

    /*
     * Arrived via Multicast UDP
     */
    TRANSPORT_MULTICAST_UDP = 6;

    /*
     * Arrived via API connection
     */
    TRANSPORT_API = 7;

    /*
     * Arrived via Unicast UDP
     */
    TRANSPORT_UNICAST_UDP = 8;
  }

  /*
   * The originating node: header `from`, covered by the AAD and part of the nonce.
   */
  fixed32 from = 1;

  /*
   * The destination node: header `to` on a UCAST frame. All ones (4,294,967,295) on a
   * BCAST frame, whose header carries no `to`; such a packet is addressed to a channel.
   */
  fixed32 to = 2;

  /*
   * A unique ID for this packet: header `id`, covered by the AAD and part of the nonce.
   * Useful for duplicate suppression, and for matching a response to its request.
   */
  fixed32 id = 3;

  /*
   * Index of the channel this packet was sent or received on, 0 being the primary.
   * Local: a node holds only the channels it knows, so the index means nothing to
   * another node. Set when the packet is decoded or originated locally; the header
   * carries channel_hash instead.
   */
  uint32 channel = 4;

  /*
   * Neither is set on the wire simultaneously: a packet is either decoded locally
   * or carried as ciphertext.
   */
  oneof payload_variant {
    /*
     * The plaintext payload, once decrypted or when originated locally
     */
    Data decoded = 5;

    /*
     * The frame's ciphertext and authentication tag, as received
     */
    bytes encrypted = 6;
  }

  /*
   * Packet-level boolean flags: a bitwise OR of Flags values.
   *
   * The low nibble matches the v3 header's flags byte bit for bit, so firmware copies
   * it without remapping. 0x02 is that byte's opt bit, which a MeshPacket expresses
   * as a non-empty header_options instead.
   */
  enum Flags {
    /* Nothing set */
    PACKET_NONE = 0x00;
    /* Relays record the path this packet takes (header flags.path) */
    PACKET_RECORD_PATH = 0x01;
    /* This packet passed via MQTT somewhere along its path (header flags.mqtt) */
    PACKET_VIA_MQTT = 0x04;
    /* The sender wants this packet acknowledged (header flags.ack) */
    PACKET_WANT_ACK = 0x08;
    /* The packet was en/decrypted using PKI; local, not in the header */
    PACKET_PKI_ENCRYPTED = 0x10;
    /* The packet carries a valid XEdDSA signature; local, not in the header */
    PACKET_XEDDSA_SIGNED = 0x20;
  }

  /*
   * Bitwise OR of Flags values.
   */
  uint32 flags = 7;

  /*
   * Remaining hop budget: header ctrl.hop_limit, 0-15 in four bits. A relay forwards
   * while it is above zero and decrements it. It is outside the AAD, so a receiver
   * drops a frame whose hop_limit exceeds hop_start.
   */
  uint32 hop_limit = 8;

  /*
   * The hop budget the originator launched with: header flags.hop_start, 0-15 in
   * four bits, covered by the AAD. hop_start - hop_limit is the number of hops taken,
   * and because only one of the two is authenticated it is a hint, never an
   * authorisation input (SCHEMA.md §8, Hop accounting).
   */
  uint32 hop_start = 9;

  /*
   * Last byte of the NodeNum this packet is meant for next: header next_hop, UCAST
   * only. Set by the firmware; clients do not set it.
   */
  uint32 next_hop = 10;

  /*
   * Last byte of the NodeNum that last transmitted this packet: header relay.
   * Set by the firmware; clients do not set it.
   */
  uint32 relay_node = 11;

  /*
   * The time this message was received by this node (secs since 1970).
   * Note: this field is _never_ sent on the radio link itself (to save space).
   * Explicit presence: firmware cannot always attach a trustworthy wall-clock timestamp at the
   * moment of reception - a node with no GPS and no phone connected yet has no time source at
   * all. has_rx_time disambiguates that state from a genuine (if coincidental) 1970-01-01 reading.
   */
  optional fixed32 rx_time = 12;

  /*
   * *Never* sent over the radio links.
   * Set during reception to indicate the SNR of this packet.
   * Value is in dB, scaled by 4 (i.e. multiply raw dB by 4 before storing).
   */
  sint32 rx_snr = 13;

  /*
   * RSSI of received packet. Only sent to phone for display purposes.
   * Value is in dBm (negative for all but the strongest received signals).
   * Explicit presence: rssi 0 is a legitimate reading on some radios (SX126x can report exactly
   * 0 dBm; SX127x's formula can even go positive). has_rx_rssi disambiguates; a replayed packet
   * built from history should leave this field absent rather than emitting 0.
   */
  optional sint32 rx_rssi = 14;

  /*
   * Records the public key the packet was encrypted with, if applicable.
   */
  bytes public_key = 15;

  // Fields 16+ use 2-byte protobuf tags; less-critical fields go here

  /*
   * The priority of this message for sending.
   * See MeshPacket.Priority description for more details.
   */
  Priority priority = 16;

  /*
   * *Never* sent over the radio links.
   * Timestamp after which this packet may be sent.
   * Set by the firmware internally, clients are not supposed to set this.
   */
  uint32 tx_after = 17;

  /*
   * Indicates which transport mechanism this packet arrived over
   */
  TransportMechanism transport_mechanism = 18;

  /*
   * The v3 header's options block, exactly as it appeared on air. Non-empty exactly
   * when the header's flags.opt is set.
   *
   * Carried through opaquely so the phone API and MQTT deliver a packet's options
   * intact, including fields this build does not know. Encodes a HeaderOptions
   * (wire.proto). Never re-encode it: decoding and re-encoding drops unknown fields
   * and defeats the point of the block.
   */
  bytes header_options = 19;

  /*
   * Header chan: the one-byte hash of the channel name and key, as carried on a BCAST
   * frame. It picks the key a receiver tries, and it is all a receiver that cannot
   * decode the packet, such as an MQTT consumer without the key, has to go on. Not
   * meaningful on UCAST, which carries no channel.
   */
  uint32 channel_hash = 20;

  /*
   * The v3 header's path tail: one-byte NodeNum suffixes of the hops between `from`
   * and relay_node, oldest first. Its length is max(0, hop_start - hop_limit - 1)
   * when PACKET_RECORD_PATH is set, and it is empty when that flag is clear.
   */
  bytes path = 21;
}
