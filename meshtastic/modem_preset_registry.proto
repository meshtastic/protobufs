syntax = "proto3";

package meshtastic;

import "meshtastic/common.proto";

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "ModemPresetRegistryProtos";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";

/*
 * Modem Preset Registry
 *
 * NOT used on-wire; consumed by clients/apps and optionally embedded in firmware.
 * Centralizes the radio parameters of each ModemPreset. Which presets a region
 * permits, and whether that needs a licensed operator, is region data in
 * region_registry.proto.
 *
 * Data lives in registry/modem_presets.yaml. tools/gen_registry.py validates it
 * and generates registry/generated/modem_presets.json, which `buf convert`
 * serializes.
 * Firmware can generate its modem config table from this data or embed it directly.
 */

/*
 * Complete definition of a single modem preset
 */
message ModemPresetInfo {
  /* Which preset this defines */
  ModemPreset preset = 1;

  /*
   * Preset name as firmware displays it, e.g. "LongFast", "ShortTurbo". A primary
   * channel without a name of its own takes this one, and its frequency slot derives
   * from the hash, so a change moves every node on such a channel.
   */
  string name = 2;

  /* Bandwidth in kHz in a sub-GHz region (e.g. 125, 250, 500), rounded down */
  uint32 bandwidth_khz = 3;

  /*
   * Bandwidth in kHz in a wide LoRa region (RegionInfo.wide_lora, above 1 GHz),
   * rounded down: 812.5 kHz is 812. 0 = the preset has no wide form, and no wide
   * region permits it.
   */
  uint32 wide_bandwidth_khz = 4;

  /* Spreading factor (5-12) */
  uint32 spread_factor = 5;

  /* Coding rate denominator (5-8, i.e. 4/5 through 4/8) */
  uint32 coding_rate = 6;
}

/*
 * The complete modem preset registry
 */
message ModemPresetRegistry {
  /* Every preset with a definition */
  repeated ModemPresetInfo presets = 1;

  /*
   * Raised by every change to the data. CI rejects a change that leaves it where it
   * was, so a client can tell whether its bundled copy is current.
   */
  uint32 revision = 2;
}
