syntax = "proto3";

package meshtastic;

/* trunk-ignore(buf-lint/COMPILE) */
import "meshtastic/api.proto";
import "meshtastic/channel.proto";
import "meshtastic/common.proto";
import "meshtastic/localonly.proto";
import "meshtastic/packet.proto";
import "meshtastic/telemetry.proto";
import "meshtastic/wire.proto";
import "nanopb.proto";

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "DeviceOnly";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";
option (nanopb_fileopt).include = "<vector>";

/*
 * Position with static location information only for NodeDBLite
 */
message PositionLite {
  /*
   * Latitude, scaled exactly as Position.latitude_scaled is, so a stored position
   * keeps the encoding it arrived in and costs flash in proportion to the precision
   * it actually carries. Storage never keeps the unpacked form.
   */
  sint32 latitude_scaled = 1;

  /*
   * Longitude, scaled exactly as Position.longitude_scaled is.
   */
  sint32 longitude_scaled = 2;

  /*
   * In meters above MSL (but see issue #359)
   */
  sint32 altitude = 3;

  /*
   * This is usually not sent over the mesh (to save space), but it is sent
   * from the phone so that the local device can set its RTC If it is sent over
   * the mesh (because there are devices on the mesh without GPS), it will only
   * be sent by devices which has a hardware GPS clock.
   * seconds since 1970
   */
  fixed32 time = 4;

  /*
   * How the position was obtained (manual, onboard GPS, or external GPS)
   */
  LocSource location_source = 5;

  /*
   * Indicates the bits of precision set by the sending node
   */
  uint32 precision_bits = 6;
}

message NodeInfoLite {
  /*
   * The node number
   */
  uint32 num = 1;

  /*
   * Hardware model the user's device is running.
   * Packed vendor/device id: (vendor_id << 8) | device_id. See hw_vendor_registry.proto.
   */
  uint32 hw_model = 2;

  /*
   * The user's role in the mesh.
   */
  Role role = 3;

  /*
   * SNR of the last received message: dB x 4, zigzag-encoded.
   * Matches the RouteDiscovery convention. Encode: snr = (int32_t)lroundf(snr_db * 4.0f).
   * Decode: snr_db = snr / 4.0f.
   * A stored 0 does not by itself mean "unknown" - see NODEINFO_BITFIELD_HAS_SNR in
   * src/mesh/NodeDB.h for the presence bit that disambiguates a genuine 0 dB reading
   * from "never measured".
   */
  sint32 snr = 4;

  /*
   * Set to indicate the last time we received a packet from this node
   */
  fixed32 last_heard = 5;

  /*
   * local channel index we heard that node on. Only populated if its not the default channel.
   */
  uint32 channel = 6;

  /*
   * The public key of the user's device, for PKI-based encrypted DMs.
   */
  bytes public_key = 7;

  /*
   * Number of hops away from us this node is (0 if direct neighbor)
   */
  optional uint32 hops_away = 8;

  /*
   * Last byte of the node number of the node that should be used as the next hop to reach this node.
   */
  uint32 next_hop = 9;

  /*
   * Per-node boolean flags: a bitwise OR of NodeFlags values (common.proto).
   * Shares its definition with NodeInfo.flags, so the stored and client-facing
   * words are interchangeable.
   */
  uint32 bitfield = 10;

  /*
   * A full name for this user, i.e. "Kevin Hester".
   */
  string long_name = 11;

  /*
   * A VERY short name, ideally two characters or an emoji.
   * Suitable for a tiny OLED screen.
   */
  string short_name = 12;
}

/*
 * This message is never sent over the wire, but it is used for serializing DB
 * state to flash in the device code
 * FIXME, since we write this each time we enter deep sleep (and have infinite
 * flash) it would be better to use some sort of append only data structure for
 * the receive queue and use the preferences store for the other stuff
 */
message DeviceState {
  /*
   * Read only settings/info about this node
   */
  MyNodeInfo my_node = 1;

  /*
   * My owner info
   */
  User owner = 2;

  /*
   * Received packets saved for delivery to the phone
   */
  repeated MeshPacket receive_queue = 3;

  /*
   * A version integer used to invalidate old save files when we make
   * incompatible changes This integer is set at build time and is private to
   * NodeDB.cpp in the device code.
   */
  uint32 version = 4;

  /*
   * We keep the last received text message (only) stored in the device flash,
   * so we can show it on the screen.
   * Might be null
   */
  MeshPacket rx_text_message = 5;

  /*
   * We keep the last received waypoint stored in the device flash,
   * so we can show it on the screen.
   * Might be null
   */
  MeshPacket rx_waypoint = 6;

  /*
   * The mesh's nodes with their available gpio pins for RemoteHardware module
   */
  repeated NodeRemoteHardwarePin node_remote_hardware_pins = 7;
}

// Satellite per-node entries; stored alongside the slim NodeInfoLite so nodes
// that never report don't pay the embedded cost.

message NodePositionEntry {
  uint32 num = 1;
  PositionLite position = 2;
}

message NodeTelemetryEntry {
  uint32 num = 1;
  DeviceMetrics device_metrics = 2;
}

message NodeReadingsEntry {
  uint32 num = 1;
  SensorReadings readings = 2;
}

message NodeStatusEntry {
  uint32 num = 1;
  StatusMessage status = 2;
}

message NodeDatabase {
  /*
   * A version integer used to invalidate old save files when we make
   * incompatible changes This integer is set at build time and is private to
   * NodeDB.cpp in the device code.
   */
  uint32 version = 1;

  /*
   * New lite version of NodeDB to decrease memory footprint
   */
  repeated NodeInfoLite nodes = 2 [(nanopb).callback_datatype = "std::vector<meshtastic_NodeInfoLite>"];

  // Per-NodeNum satellite arrays. Constrained platforms (e.g. STM32WL) omit
  // these via MESHTASTIC_EXCLUDE_*DB build flags.
  repeated NodePositionEntry positions = 3 [(nanopb).callback_datatype = "std::vector<meshtastic_NodePositionEntry>"];
  repeated NodeTelemetryEntry telemetry = 4 [(nanopb).callback_datatype = "std::vector<meshtastic_NodeTelemetryEntry>"];
  repeated NodeStatusEntry status = 5 [(nanopb).callback_datatype = "std::vector<meshtastic_NodeStatusEntry>"];
  repeated NodeReadingsEntry readings = 6 [(nanopb).callback_datatype = "std::vector<meshtastic_NodeReadingsEntry>"];
}

/*
 * The on-disk saved channels
 */
message ChannelFile {
  /*
   * The channels our node knows about
   */
  repeated Channel channels = 1;

  /*
   * A version integer used to invalidate old save files when we make
   * incompatible changes This integer is set at build time and is private to
   * NodeDB.cpp in the device code.
   */
  uint32 version = 2;
}

/*
 * The on-disk backup of the node's preferences
 */
message BackupPreferences {
  /*
   * The version of the backup
   */
  uint32 version = 1;

  /*
   * The timestamp of the backup (if node has time)
   */
  fixed32 timestamp = 2;

  /*
   * The node's configuration
   */
  LocalConfig config = 3;

  /*
   * The node's module configuration
   */
  LocalModuleConfig module_config = 4;

  /*
   * The node's channels
   */
  ChannelFile channels = 5;

  /*
   * The node's user (owner) information
   */
  User owner = 6;
}
