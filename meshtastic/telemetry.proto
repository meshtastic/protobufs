syntax = "proto3";

package meshtastic;

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "TelemetryProtos";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";

/*
 * Key native device metrics such as battery level
 */
message DeviceMetrics {
  /*
   * 0-100 (>100 means powered)
   */
  optional uint32 battery_level = 1;

  /*
   * Voltage in mV (millivolts)
   */
  optional uint32 voltage = 2;

  /*
   * Channel utilization x100 (e.g. 2550 = 25.50%)
   */
  optional uint32 channel_utilization = 3;

  /*
   * Percent of airtime for TX x100 (e.g. 1025 = 10.25%)
   */
  optional uint32 air_util_tx = 4;

  /*
   * How long the device has been running since the last reboot (in seconds)
   */
  optional uint32 uptime_seconds = 5;
}

/*
 * Local device mesh statistics
 */
message LocalStats {
  /*
   * How long the device has been running since the last reboot (in seconds)
   */
  uint32 uptime_seconds = 1;
  /*
   * Channel utilization x100
   */
  uint32 channel_utilization = 2;
  /*
   * Percent of airtime for TX x100
   */
  uint32 air_util_tx = 3;

  /*
   * Number of packets sent
   */
  uint32 num_packets_tx = 4;

  /*
   * Number of packets received (both good and bad)
   */
  uint32 num_packets_rx = 5;

  /*
   * Number of packets received that are malformed or violate the protocol
   */
  uint32 num_packets_rx_bad = 6;

  /*
   * Number of nodes online (in the past 2 hours)
   */
  uint32 num_online_nodes = 7;

  /*
   * Number of nodes total
   */
  uint32 num_total_nodes = 8;

  /*
   * Number of received packets that were duplicates (due to multiple nodes relaying).
   * If this number is high, there are nodes in the mesh relaying packets when it's unnecessary, for example due to the ROUTER/REPEATER role.
   */
  uint32 num_rx_dupe = 9;

  /*
   * Number of packets we transmitted that were a relay for others (not originating from ourselves).
   */
  uint32 num_tx_relay = 10;

  /*
   * Number of times we canceled a packet to be relayed, because someone else did it before us.
   * This will always be zero for ROUTERs/REPEATERs. If this number is high, some other node(s) is/are relaying faster than you.
   */
  uint32 num_tx_relay_canceled = 11;

  /*
   * Number of bytes used in the heap
   */
  uint32 heap_total_bytes = 12;

  /*
   * Number of bytes free in the heap
   */
  uint32 heap_free_bytes = 13;

  /*
   * Number of packets that were dropped because the transmit queue was full.
   */
  uint32 num_tx_dropped = 14;

  /*
   * Noise floor in dBm (negative)
   */
  sint32 noise_floor = 15;
}

/*
 * Traffic management statistics for mesh network optimization
 */
message TrafficManagementStats {
  /*
   * Total number of packets inspected by traffic management
   */
  uint32 packets_inspected = 1;

  /*
   * Number of position packets dropped due to deduplication
   */
  uint32 position_dedup_drops = 2;

  /*
   * Number of NodeInfo requests answered from cache
   */
  uint32 nodeinfo_cache_hits = 3;

  /*
   * Number of packets dropped due to rate limiting
   */
  uint32 rate_limit_drops = 4;

  /*
   * Number of unknown/undecryptable packets dropped
   */
  uint32 unknown_packet_drops = 5;

  /*
   * Number of packets with hop_limit exhausted for local-only broadcast
   */
  uint32 hop_exhausted_packets = 6;

  /*
   * Number of times router hop preservation was applied
   */
  uint32 router_hops_preserved = 7;
}

/*
 * Linux host metrics
 */
message HostMetrics {
  /*
   * Host system uptime
   */
  uint32 uptime_seconds = 1;

  /*
   * Host system free memory
   */
  uint64 freemem_bytes = 2;

  /*
   * Host system disk space free for /
   */
  uint64 diskfree1_bytes = 3;

  /*
   * Secondary system disk space free
   */
  optional uint64 diskfree2_bytes = 4;

  /*
   * Tertiary disk space free
   */
  optional uint64 diskfree3_bytes = 5;

  /*
   * Host system one minute load in 1/100ths
   */
  uint32 load1 = 6;

  /*
   * Host system five minute load  in 1/100ths
   */
  uint32 load5 = 7;

  /*
   * Host system fifteen minute load  in 1/100ths
   */
  uint32 load15 = 8;

  /*
   * Optional User-provided string for arbitrary host system information
   * that doesn't make sense as a dedicated entry.
   */
  optional string user_string = 9;
}

/*
 * A list of sensor readings.
 *
 * Replaces the fixed typed metric messages. Those declared one field per quantity,
 * which meant most of the message was absent on any given node, a node could never
 * report two of the same quantity, and every new sensor needed a schema change. Six
 * separate temperature fields and three channel-indexed voltage pairs were the
 * symptom.
 *
 * A reading is a (key, value) pair held in parallel packed arrays. `values`,
 * `time_offsets` and `sensors` are indexed by the same position as `keys`; an array
 * that is present must have the same length as `keys`.
 *
 * Send as many readings as the payload allows, then start another message.
 *
 * On size: a reading costs one key byte plus one to three value bytes, against a
 * typed field's one to two tag bytes plus the same value. The generic form is
 * therefore slightly larger for a three-reading BME280 broadcast and slightly
 * smaller for anything that used to sit above field 15, which was most of the
 * catalogue. What it actually buys is unbounded quantities, repeated quantities and
 * no schema churn per sensor.
 */
message SensorReadings {
  /*
   * What a reading measures, including the unit and scale it is reported in.
   *
   * The unit is part of the quantity rather than a separate field: it costs nothing
   * per reading, and two nodes can never report the same quantity in different
   * units. Values are 1..127 so a key with ordinal 0 fits in a single byte.
   *
   * Every quantity names a fixed-point scale, so a value is always an integer and
   * never a float. `_CENTI` means hundredths of the named unit: 23.50 C is 2350 under
   * TEMPERATURE_C_CENTI. A quantity that needs no fraction, like CO2_PPM, is a plain
   * integer. This is deliberate - a float is always four bytes on the wire where a
   * scaled varint is one to three, spends its precision on significant digits no
   * sensor has, and costs software floating point on an FPU-less MCU. If a quantity
   * ever needs finer resolution, its enum value gets a finer scale; the encoding
   * never changes per reading.
   *
   * Where a quantity is measured by several sensors on one node - air temperature
   * from the BME280, the SCD4X and the PM sensor - use one quantity and distinguish
   * them by ordinal, optionally naming each in `sensors`. Only a genuinely different
   * measurand gets its own quantity, which is why soil and body temperature are
   * separate from air temperature.
   */
  enum Quantity {
    /* Not set; never valid in a key */
    QUANTITY_UNSET = 0;

    // --- Atmosphere ---
    /* Air temperature, centi-degrees Celsius (2350 = 23.50 C) */
    TEMPERATURE_C_CENTI = 1;
    /* Relative humidity, centi-percent (6550 = 65.50 %) */
    HUMIDITY_PCT_CENTI = 2;
    /* Barometric pressure, pascals (101325) */
    PRESSURE_PA = 3;
    /* Gas resistance, kilo-ohms */
    GAS_RESISTANCE_KOHM = 4;
    /* Indoor air quality index, 0..500 */
    IAQ = 5;

    // --- Light ---
    /* Ambient illuminance, centi-lux */
    ILLUMINANCE_LUX_CENTI = 6;
    /* White-channel illuminance, centi-lux */
    ILLUMINANCE_WHITE_LUX_CENTI = 7;
    /* Infrared illuminance, centi-lux */
    ILLUMINANCE_IR_LUX_CENTI = 8;
    /* Ultraviolet illuminance, centi-lux */
    ILLUMINANCE_UV_LUX_CENTI = 9;
    /* Solar irradiance, watts per square metre */
    SOLAR_IRRADIANCE_WM2 = 10;

    // --- Wind and rain ---
    /* Wind direction, degrees true, 0..359 */
    WIND_DIRECTION_DEG = 11;
    /* Wind speed, centimetres per second */
    WIND_SPEED_CMS = 12;
    /* Wind gust, centimetres per second */
    WIND_GUST_CMS = 13;
    /* Wind lull, centimetres per second */
    WIND_LULL_CMS = 14;
    /* Rainfall in the last hour, millimetres */
    RAINFALL_1H_MM = 15;
    /* Rainfall in the last 24 hours, millimetres */
    RAINFALL_24H_MM = 16;

    // --- Electrical ---
    /* Voltage, millivolts. Ordinal selects the channel. */
    VOLTAGE_MV = 17;
    /* Current, milliamps, negative when discharging. Ordinal selects the channel. */
    CURRENT_MA = 18;

    // --- Ranging and mass ---
    /* Distance, millimetres */
    DISTANCE_MM = 19;
    /* Weight, grams */
    WEIGHT_G = 20;

    // --- Radiation and lightning ---
    /* Ionising radiation, microroentgen per hour */
    RADIATION_URH = 21;
    /* Lightning strikes detected in the last hour */
    LIGHTNING_STRIKES_1H = 22;
    /* Distance to the leading edge of the storm, kilometres */
    LIGHTNING_DISTANCE_KM = 23;

    // --- Soil ---
    /* Soil temperature, centi-degrees Celsius */
    SOIL_TEMPERATURE_C_CENTI = 24;
    /* Soil moisture, percent */
    SOIL_MOISTURE_PCT = 25;
    /* Soil pH, centi-pH (725 = pH 7.25) */
    SOIL_PH_CENTI = 26;
    /* Nitrogen, milligrams per kilogram */
    NITROGEN_MGKG = 27;
    /* Phosphorus, milligrams per kilogram */
    PHOSPHORUS_MGKG = 28;
    /* Potassium, milligrams per kilogram */
    POTASSIUM_MGKG = 29;

    // --- Water ---
    /* pH of water or solution, centi-pH */
    PH_CENTI = 30;
    /* Electrical conductivity, microsiemens per centimetre */
    CONDUCTIVITY_USCM = 31;
    /* Salinity, milligrams per litre */
    SALINITY_MGL = 32;
    /* Dissolved oxygen, centi-milligrams per litre */
    DISSOLVED_OXYGEN_MGL_CENTI = 33;
    /* Oxidation-reduction potential, millivolts, may be negative */
    ORP_MV = 34;
    /* Chemical oxygen demand, milligrams per litre */
    COD_MGL = 35;
    /* Biochemical oxygen demand, milligrams per litre */
    BOD_MGL = 36;
    /* Turbidity, centi-NTU */
    TURBIDITY_NTU_CENTI = 37;
    /* Nitrate, centi-ppm */
    NITRATE_PPM_CENTI = 38;
    /* Ammonium, centi-ppm */
    AMMONIUM_PPM_CENTI = 39;

    // --- Particulate mass, micrograms per cubic metre ---
    /* PM1.0, standard conditions */
    PM1_0_STD_UGM3 = 40;
    /* PM2.5, standard conditions */
    PM2_5_STD_UGM3 = 41;
    /* PM4.0, standard conditions */
    PM4_0_STD_UGM3 = 42;
    /* PM10.0, standard conditions */
    PM10_0_STD_UGM3 = 43;
    /* PM1.0, ambient conditions */
    PM1_0_ENV_UGM3 = 44;
    /* PM2.5, ambient conditions */
    PM2_5_ENV_UGM3 = 45;
    /* PM10.0, ambient conditions */
    PM10_0_ENV_UGM3 = 46;

    // --- Particle counts per decilitre, by size bin ---
    /* Particles at least 0.3 um */
    PARTICLES_0_3UM = 47;
    /* Particles at least 0.5 um */
    PARTICLES_0_5UM = 48;
    /* Particles at least 1.0 um */
    PARTICLES_1_0UM = 49;
    /* Particles at least 2.5 um */
    PARTICLES_2_5UM = 50;
    /* Particles at least 4.0 um */
    PARTICLES_4_0UM = 51;
    /* Particles at least 5.0 um */
    PARTICLES_5_0UM = 52;
    /* Particles at least 10.0 um */
    PARTICLES_10_0UM = 53;
    /* Typical particle size, centi-micrometres */
    PARTICLE_SIZE_UM_CENTI = 54;

    // --- Gases and indices ---
    /* Carbon dioxide, parts per million */
    CO2_PPM = 55;
    /* Formaldehyde, parts per billion */
    FORMALDEHYDE_PPB = 56;
    /* VOC index */
    VOC_INDEX = 57;
    /* NOx index */
    NOX_INDEX = 58;
    /*
     * Raw PM sensor status/error register, as defined by the sensor's own datasheet.
     * A bitmask rather than a measurement; see the sensor named in `sensors`.
     */
    PM_STATUS_FLAGS = 59;

    // --- Body ---
    /* Heart rate, beats per minute */
    HEART_RATE_BPM = 60;
    /* Blood oxygen saturation, percent */
    SPO2_PCT = 61;
    /* Body temperature, centi-degrees Celsius */
    BODY_TEMPERATURE_C_CENTI = 62;
  }

  /*
   * One key per reading: `(ordinal << 7) | quantity`.
   *
   * The ordinal distinguishes several sensors reporting the same quantity on one
   * node and is 0 for the first or only one, so an ordinary reading's key is a
   * single byte. A second sensor of the same quantity pushes its key to two.
   */
  repeated uint32 keys = 1;

  /*
   * One value per reading, in the unit and scale its quantity names.
   */
  repeated sint32 values = 2;

  /*
   * Optional, one per reading: seconds relative to Telemetry.time, signed.
   *
   * Omit entirely for live readings, which is the normal case and costs nothing.
   * Populate it when replaying measurements a node buffered while it had no
   * connectivity: a batch spanning an hour costs about two bytes per reading, where
   * an absolute timestamp would cost four.
   */
  repeated sint32 time_offsets = 3;

  /*
   * Optional, one per reading: the TelemetrySensorType that produced it.
   *
   * Omit unless provenance matters - telling two temperature sensors apart, or
   * attributing a calibration or a status register. Costs nothing when absent.
   */
  repeated uint32 sensors = 4;
}

/*
 * Types of Measurements the telemetry module is equipped to handle
 */
message Telemetry {
  /*
   * Seconds since 1970 - or 0 for unknown/unset
   */
  fixed32 time = 1;

  oneof variant {
    /*
     * Key native device metrics such as battery level
     */
    DeviceMetrics device_metrics = 2;

    /*
     * Sensor readings: environment, air quality, power and health, as a list rather
     * than four messages of fixed typed fields.
     */
    SensorReadings sensor_readings = 3;

    /*
     * Local device mesh statistics
     */
    LocalStats local_stats = 4;

    /*
     * Linux host metrics
     */
    HostMetrics host_metrics = 5;

    /*
     * Traffic management statistics
     */
    TrafficManagementStats traffic_management_stats = 6;
  }
}

/*
 * Supported I2C Sensors for telemetry in Meshtastic
 */
enum TelemetrySensorType {
  /*
   * No external telemetry sensor explicitly set
   */
  SENSOR_UNSET = 0;

  /*
   * High accuracy temperature, pressure, humidity
   */
  BME280 = 1;

  /*
   * High accuracy temperature, pressure, humidity, and air resistance
   */
  BME680 = 2;

  /*
   * Very high accuracy temperature
   */
  MCP9808 = 3;

  /*
   * Moderate accuracy current and voltage
   */
  INA260 = 4;

  /*
   * Moderate accuracy current and voltage
   */
  INA219 = 5;

  /*
   * High accuracy temperature and pressure
   */
  BMP280 = 6;

  /*
   * Superseded by SHTXX, which covers the whole SHT family
   */

  /*
   * High accuracy pressure
   */
  LPS22 = 8;

  /*
   * 3-Axis magnetic sensor
   */
  QMC6310 = 9;

  /*
   * 6-Axis inertial measurement sensor
   */
  QMI8658 = 10;

  /*
   * 3-Axis magnetic sensor
   */
  QMC5883L = 11;

  /*
   * 12 was SHT31: superseded by SHTXX, which covers the whole SHT family
   */

  /*
   * PM2.5 air quality sensor
   */
  PMSA003I = 13;

  /*
   * INA3221 3 Channel Voltage / Current Sensor
   */
  INA3221 = 14;

  /*
   * BMP085/BMP180 High accuracy temperature and pressure (older Version of BMP280)
   */
  BMP085 = 15;

  /*
   * RCWL-9620 Doppler Radar Distance Sensor, used for water level detection
   */
  RCWL9620 = 16;

  /*
   * 17 was SHT4X: superseded by SHTXX, which covers the whole SHT family
   */

  /*
   * VEML7700 high accuracy ambient light(Lux) digital 16-bit resolution sensor.
   */
  VEML7700 = 18;

  /*
   * MLX90632 non-contact IR temperature sensor.
   */
  MLX90632 = 19;

  /*
   * TI OPT3001 Ambient Light Sensor
   */
  OPT3001 = 20;

  /*
   * Lite On LTR-390UV-01 UV Light Sensor
   */
  LTR390UV = 21;

  /*
   * AMS TSL25911FN RGB Light Sensor
   */
  TSL25911FN = 22;

  /*
   * AHT10 Integrated temperature and humidity sensor
   */
  AHT10 = 23;

  /*
   * DFRobot Lark Weather station (temperature, humidity, pressure, wind speed and direction)
   */
  DFROBOT_LARK = 24;

  /*
   * NAU7802 Scale Chip or compatible
   */
  NAU7802 = 25;

  /*
   * BMP3XX High accuracy temperature and pressure
   */
  BMP3XX = 26;

  /*
   * ICM-20948 9-Axis digital motion processor
   */
  ICM20948 = 27;

  /*
   * MAX17048 1S lipo battery sensor (voltage, state of charge, time to go)
   */
  MAX17048 = 28;

  /*
   * Custom I2C sensor implementation based on https://github.com/meshtastic/i2c-sensor
   */
  CUSTOM_SENSOR = 29;

  /*
   * MAX30102 Pulse Oximeter and Heart-Rate Sensor
   */
  MAX30102 = 30;

  /*
   * MLX90614 non-contact IR temperature sensor
   */
  MLX90614 = 31;

  /*
   * SCD40/SCD41 CO2, humidity, temperature sensor
   */
  SCD4X = 32;

  /*
   * ClimateGuard RadSens, radiation, Geiger-Muller Tube
   */
  RADSENS = 33;

  /*
   * High accuracy current and voltage
   */
  INA226 = 34;

  /*
   * DFRobot Gravity tipping bucket rain gauge
   */
  DFROBOT_RAIN = 35;

  /*
   * Infineon DPS310 High accuracy pressure and temperature
   */
  DPS310 = 36;

  /*
   * RAKWireless RAK12035 Soil Moisture Sensor Module
   */
  RAK12035 = 37;

  /*
   * MAX17261 lipo battery gauge
   */
  MAX17261 = 38;

  /*
   * PCT2075 Temperature Sensor
   */
  PCT2075 = 39;

  /*
   * ADS1X15 ADC
   */
  ADS1X15 = 40;

  /*
   * ADS1X15 ADC_ALT
   */
  ADS1X15_ALT = 41;

  /*
   * Sensirion SFA30 Formaldehyde sensor
   */
  SFA30 = 42;

  /*
   * SEN5X PM SENSORS
   */
  SEN5X = 43;

  /*
   * TSL2561 light sensor
   */
  TSL2561 = 44;

  /*
   * BH1750 light sensor
   */
  BH1750 = 45;

  /*
   * HDC1080 Temperature and Humidity Sensor
   */
  HDC1080 = 46;

  /*
   * 47 was SHT21: superseded by SHTXX, which covers the whole SHT family
   */

  /*
   * Sensirion STC31 CO2 sensor
   */
  STC31 = 48;

  /*
   * SCD30 CO2, humidity, temperature sensor
   */
  SCD30 = 49;

  /*
   * SHT family of sensors for temperature and humidity
   */
  SHTXX = 50;

  /*
   * DS248X Bridge for one-wire temperature sensors
   */
  DS248X = 51;

  /*
   * MMC5983MA 3-Axis Digital Magnetic Sensor
   */
  MMC5983MA = 52;

  /*
   * ICM-42607-P 6‑Axis IMU
   */
  ICM42607P = 53;

  /*
   * SPA06 pressure and temperature
   */
  SPA06 = 54;

  /*
   * HM330X PM SENSOR
   */
  HM330X = 55;

  /*
   * Sensirion SEN6X PM/RHT/VOC/NOx/CO2/HCHO sensor family (SEN62, SEN63C, SEN65, SEN66, SEN68, SEN69C)
   */
  SEN6X = 56;

  /*
   * AS3935 Franklin lightning sensor
   */
  AS3935 = 57;
}

/*
 * NAU7802 Telemetry configuration, for saving to flash
 */
message Nau7802Config {
  /*
   * The offset setting for the NAU7802
   */
  int32 zeroOffset = 1;

  /*
   * The calibration factor for the NAU7802
   */
  float calibrationFactor = 2;
}

/*
 * AS3935 lightning sensor configuration, for saving to flash
 */
message AS3935Config {
  /*
   * Antenna tuning capacitance in pF, 0 to 120 in steps of 8. The chip does not retain
   * this across power loss, so it is stored here and re-applied on every boot.
   */
  uint32 tuning_cap_pf = 1;
}

/*
 * SEN5X State, for saving to flash (to be merged with SEN6XState)
 */
message SEN5XState {
  /*
   * Last cleaning time for SEN5X
   */
  uint32 last_cleaning_time = 1;

  /*
   * Last cleaning time for SEN5X - valid flag
   */
  bool last_cleaning_valid = 2;

  /*
   * Config flag for one-shot mode (see admin.proto)
   */
  bool one_shot_mode = 3;

  /*
   * Last VOC state time for SEN55
   */
  optional uint32 voc_state_time = 4;

  /*
   * Last VOC state validity flag for SEN55
   */
  optional bool voc_state_valid = 5;

  /*
   * VOC state array (8x uint8t) for SEN55
   */
  optional fixed64 voc_state_array = 6;
}

/*
 * SEN6X State, for saving to flash
 */
message SEN6XState {
  /*
   * Last cleaning time for SEN6X
   */
  uint32 last_cleaning_time = 1;

  /*
   * Last cleaning time for SEN6X - valid flag
   */
  bool last_cleaning_valid = 2;

  /*
   * Config flag for one-shot mode (see admin.proto)
   */
  bool one_shot_mode = 3;

  /*
   * Last VOC state time, for models with a VOC sensor (SEN65, SEN66, SEN68, SEN69C)
   */
  optional uint32 voc_state_time = 4;

  /*
   * Last VOC state validity flag, for models with a VOC sensor (SEN65, SEN66, SEN68, SEN69C)
   */
  optional bool voc_state_valid = 5;

  /*
   * VOC state array (8x uint8t), for models with a VOC sensor (SEN65, SEN66, SEN68, SEN69C)
   */
  optional fixed64 voc_state_array = 6;
}
