syntax = "proto3";

package meshtastic;

import "meshtastic/common.proto";
import "meshtastic/config.proto";

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "RoleRegistryProtos";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";

/*
 * Role Registry
 *
 * NOT used on-wire; consumed by clients and the firmware build. Labels for the four Role
 * values, and one row per configuration worth naming: a role, its switches, and the
 * defaults a device installs when it takes that configuration. A device that is set to a
 * role, or turns a switch on or off, installs the defaults of the row it now matches.
 *
 * Data lives in registry/roles.yaml. tools/gen_registry.py validates it and generates
 * registry/generated/roles.json, which `buf convert` serializes.
 */

/*
 * A base role as clients show it
 */
message RoleInfo {
  Role role = 1;

  /* Display name */
  string label = 2;

  /* One-line explanation */
  string description = 3;
}

/*
 * What a device sets when it takes a configuration, beyond the role and its switches. A
 * field left unset leaves the device's current value alone.
 */
message RoleDefaults {
  /* Restore every broadcast, telemetry and power interval to its default before the values below */
  bool reset_intervals = 1;

  optional DeviceConfig.RebroadcastMode rebroadcast_mode = 2;
  optional uint32 node_info_broadcast_secs = 3;
  optional uint32 position_broadcast_secs = 4;
  optional bool position_broadcast_smart_enabled = 5;
  optional uint32 broadcast_smart_minimum_distance = 6;
  optional uint32 broadcast_smart_minimum_interval_secs = 7;

  /* Bitwise OR of PositionConfig.PositionFlags values */
  optional uint32 position_flags = 8;

  optional uint32 device_update_interval_secs = 9;
  optional uint32 sensor_update_interval_secs = 10;

  /* TelemetryConfig environment measurement on or off */
  optional bool environment_measurement = 11;

  /* Advertise the node as not taking direct messages (NODE_FLAG_IS_UNMESSAGABLE) */
  optional bool unmessagable = 12;
}

/*
 * One configuration: a role, its switches and the defaults that go with them. No two rows
 * share a role, switches and TAK flags, and every role has a row without switches.
 */
message RolePreset {
  /* Stable identifier: the role and its switches, e.g. "ROUTER_RELAY_LATE" */
  string name = 1;

  /* Display name */
  string label = 2;

  /* One-line explanation */
  string description = 3;

  Role role = 4;

  /* Bitwise OR of DeviceConfig.Flags role switches; each applies to this role */
  uint32 device_flags = 5;

  /* Bitwise OR of TAKConfig.Flags values */
  uint32 tak_flags = 6;

  RoleDefaults defaults = 7;
}

/*
 * Root container for the role registry
 */
message RoleRegistry {
  /* Raised on every change to the data */
  uint32 revision = 1;

  /* One entry per Role value */
  repeated RoleInfo roles = 2;

  repeated RolePreset presets = 3;
}
