name: Push commit to schema registry

permissions:
  contents: read

on:
  push:
    branches:
      - master

# buf push resolves HEAD to a remote branch, so a commit master has moved past cannot be pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push_to_registry:
    name: Push to schema registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Push to schema registry
        uses: bufbuild/buf-action@v1.7.0
        with:
          version: 1.75.0 # renovate: datasource=github-releases depName=bufbuild/buf
          github_token: ${{ github.token }}
          token: ${{ secrets.BUF_TOKEN }}
          push: true
