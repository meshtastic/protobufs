name: kmp-pull-request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # build-kmp is a required check, so it has to report on every pull request. A
  # `paths` filter on the trigger would leave it unreported, and so blocking, on
  # a pull request that touches none of these paths; a skipped job reports success.
  changes:
    runs-on: ubuntu-latest
    outputs:
      kmp: ${{ steps.filter.outputs.kmp }}
    steps:
      - name: Detect changes that affect the KMP build
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          # This file is on the list so a change to the build itself is exercised by it.
          if grep -qE '^(meshtastic/.*\.proto|nanopb\.proto|packages/kmp/.*|\.github/workflows/kmp-pull-request\.yml)$' <<<"$files"; then
            echo "kmp=true" >> "$GITHUB_OUTPUT"
          else
            echo "kmp=false" >> "$GITHUB_OUTPUT"
          fi

  build-kmp:
    needs: changes
    # Build unless the filter positively said no, so a failed filter never passes as a skip.
    if: ${{ always() && needs.changes.outputs.kmp != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Drop the action's default `tools` package. SDK Tools is obsolete and is no
          # longer served reliably, so sdkmanager intermittently fails the job with
          # "Failed to find package 'tools'" before Gradle ever runs.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Cache Konan (Kotlin/Native toolchain)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('packages/kmp/build.gradle.kts', 'packages/kmp/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Build KMP package
        run: packages/kmp/gradlew --no-daemon -p packages/kmp build -PVERSION_NAME=0.0.0-pr
