name: pull-request

permissions:
  contents: read
  pull-requests: write

on: pull_request
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Buf PR Checks
        uses: bufbuild/buf-action@v1.5.0
        with:
          version: 1.72.0 # renovate: datasource=github-releases depName=bufbuild/buf
          github_token: ${{ github.token }}
          token: ${{ secrets.BUF_TOKEN }}
          format: true
          lint: true
          breaking: true

  bitfields:
    name: Bitfield masks
    runs-on: ubuntu-latest

    # Packed booleans are declared as an enum of hex masks beside a uint32 field.
    # protoc rejects two enum values sharing a *number*, but nothing in buf lint
    # knows a mask must be a single bit, so 0x06 for what should be one flag passes
    # every other check and silently breaks every consumer that masks with it.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate bitfield masks
        run: |
          pip install --quiet protobuf
          buf build -o descriptor.binpb
          python tools/gen_bitfield_accessors.py descriptor.binpb --check
