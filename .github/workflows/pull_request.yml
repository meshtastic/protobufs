name: pull-request

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
  merge_group:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Buf PR Checks
        uses: bufbuild/buf-action@v1.6.0
        with:
          version: 1.72.0 # renovate: datasource=github-releases depName=bufbuild/buf
          github_token: ${{ github.token }}
          token: ${{ secrets.BUF_TOKEN }}
          format: true
          lint: true
          breaking: true
          # buf-action derives the base only for push and pull_request events.
          breaking_against: ${{ github.server_url }}/${{ github.repository }}.git#format=git,commit=${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
