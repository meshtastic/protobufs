name: pull-request

permissions:
  contents: read
  pull-requests: write

on: pull_request
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Buf PR Checks
        uses: bufbuild/buf-action@v1.5.0
        with:
          version: 1.72.0 # renovate: datasource=github-releases depName=bufbuild/buf
          github_token: ${{ github.token }}
          token: ${{ secrets.BUF_TOKEN }}
          format: true
          lint: true
          breaking: true

  schema:
    name: Schema rules
    runs-on: ubuntu-latest

    # Rules the schema documents as invariants that buf lint cannot see. Packed
    # booleans are an enum of hex masks beside a uint32 field, and protoc rejects
    # two enum values sharing a *number* but does not know a mask must be a single
    # bit, so 0x06 for what should be one flag passes every other check and
    # silently breaks every consumer that masks with it. The same is true of a
    # plain int32 that can go negative, a float where a scaled integer belongs, a
    # repeated field with no nanopb bound, and an air-layer file reaching into the
    # client layer: all four build and lint clean.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build descriptor
        run: |
          pip install --quiet protobuf
          buf build -o descriptor.binpb

      - name: Validate bitfield masks
        run: python tools/gen_bitfield_accessors.py descriptor.binpb --check

      - name: Check schema rules
        run: python tools/schema_lint.py descriptor.binpb

  registry:
    name: Registry data
    runs-on: ubuntu-latest

    # The registries are data under registry/, checked by rules no schema tool can
    # see: id ranges and uniqueness, allocations that never change, revisions that
    # rise with every edit. The generated JSON must match its YAML and decode
    # against the registry messages.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1.50.0
        with:
          github_token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check registry rules and generated files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pip install --quiet pyyaml
          python tools/gen_registry.py --selftest
          python tools/gen_registry.py --check --base "origin/$BASE_REF"

      - name: Decode generated JSON against the schema
        run: |
          for pair in HwVendorRegistry:hw_vendors HwDeviceRegistry:hw_devices RegionRegistry:regions ModemPresetRegistry:modem_presets; do
            buf convert . --type "meshtastic.${pair%%:*}" --from "registry/generated/${pair#*:}.json#format=json" --to "-#format=binpb" > /dev/null
          done
